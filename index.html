  const calTeamColor = tid => (S.calUsers || []).find(u => u.team && u.team === tid)?.color || CAL_GREY;
  // What happened to a booking, in words, with a pill style.
  function calState(inv, ev){
    const by = x => x === "host" ? "by us" : x === "invitee" ? "by them" : "";
    if (inv.no_show) return ["No-show", "g-Blocked", true];
    if (inv.rescheduled) return ["Rescheduled to a new time", "g-Paused", true];
    if (inv.status === "canceled" || ev?.status === "canceled") return [`Canceled ${by(inv.canceler_type || ev?.canceler_type)}`.trim(), "g-Blocked", true];
    if (new Date(ev?.end_at || ev?.start_at) < Date.now()) return [inv.old_invitee_uri ? "Past (was rescheduled)" : "Past", "", false];
    return [inv.old_invitee_uri ? "Upcoming (rescheduled)" : "Upcoming", "g-Clear", false];
  }
  const calAnswers = (inv, open) => { const qa = [...(inv.calendly_answers || [])].filter(a => a.answer && !/^please tick to confirm/i.test(a.question)).sort((a, b) => a.position - b.position);
    return qa.length ? `<details ${open ? "open" : ""}><summary style="cursor:pointer;font-size:14px">Booking form answers (${qa.length})</summary><div class="cal-qa">${qa.map(a => `<div><b>${esc(a.question)}</b><span>${esc(a.answer)}</span></div>`).join("")}</div></details>` : `<span class="muted" style="font-size:13.5px">No booking form answers.</span>`; };
  // One booking as a card: meeting, time in Eastern, host (in their color), status, join link, the person, answers.
  function calCard(inv, o = {}){
    const ev = inv.calendly_events || o.ev || {}, hosts = (ev.calendly_event_hosts || []).map(calHost), h = hosts[0] || { name: "", color: CAL_GREY };
    const [st, cls, off] = calState(inv, ev);
    const why = (inv.cancel_reason || ev.cancel_reason) ? ` · “${esc(inv.cancel_reason || ev.cancel_reason)}”` : "";
    const utm = [inv.utm_source, inv.utm_medium, inv.utm_campaign].filter(Boolean).join(" / ");
    return `<div class="cal-card ${off ? "off" : ""}" style="--host:${esc(h.color)}">
      <div class="t"><b class="when">${esc(fmtET(ev.start_at))}</b><span class="pill ${cls}" style="font-size:12px">${esc(st)}</span>${why ? `<span class="muted" style="font-size:13px">${why}</span>` : ""}</div>
      <div>${o.showName ? `<b>${o.leadLink && inv.lead ? `<a href="#lead/${inv.lead}">${esc(inv.name || inv.email)}</a>` : esc(inv.name || inv.email || "Someone")}</b> · ` : ""}${esc(ev.name || "Meeting")}</div>
      <div class="muted" style="font-size:13.5px">${hosts.length ? `<span class="cal-dot"></span> with ${hosts.map(x => esc(x.name)).join(", ")}` : "No host listed"}${ev.join_url && !off ? ` · <a href="${esc(ev.join_url)}" target="_blank" rel="noopener noreferrer">Join link</a>` : !ev.join_url && ev.location ? " · " + esc(ev.location) : ""}${inv.email ? " · " + esc(inv.email) : ""}${inv.timezone ? " · their time zone " + esc(inv.timezone.replace(/_/g, " ")) : ""}${utm ? " · came from " + esc(utm) : ""}</div>
      ${o.noAnswers ? "" : calAnswers(inv, o.open)}</div>`;
  }
  // v6.58 (Kyle, Sun 22 Nov 2026: "why does it say the note calendly last synced blah blah? we dont need that."): no routine
  // "last synced" line any more. A red line shows only when the latest Calendly or Airtable sync failed, or the last good one is
  // over 2 hours old (the Mac is asleep or something broke). The name is kept so every caller gets the new behaviour.
  async function calSyncLine(){
    const [cal, air] = await Promise.all([
      sb.from("calendly_sync_runs").select("started_at,finished_at,status").order("started_at", { ascending: false }).limit(10).then(r => r.data || [], () => []),
      sb.from("airtable_sync_runs").select("started_at,finished_at,status").order("started_at", { ascending: false }).limit(10).then(r => r.data || [], () => [])]);
    const probs = [];
    const check = (name, runs, okSt, failSt) => { if (!runs.length) return; const ok = runs.find(r => okSt.includes(r.status)), last = runs[0];
      if (last.status === failSt) probs.push(`the last ${name} sync (${fmtTime(last.started_at)}) failed`);
      else if (!ok || Date.now() - new Date(ok.finished_at || ok.started_at) > 2 * 36e5) probs.push(`${name} hasn't synced since ${ok ? fmtTime(ok.finished_at || ok.started_at) : "it was set up"}`); };
    check("Calendly", cal, ["ok", "partial"], "failed"); check("Airtable", air, ["Done"], "Failed");
    return probs.length ? `<p class="cal-sync" role="alert" style="color:var(--bad);margin:0;font-size:14px">⚠ ${esc(probs.join("; "))}. New bookings may be missing: Kyle's Mac may be asleep. It tries again every 15 minutes.</p>` : "";
  }
  // Add as a new lead (v6.46: only needed for a Check, a name-only match; everyone else who books becomes a lead by itself): the usual
  // add, then booking_link_lead() ties this booking and any other with the same email to it and gives it its deal.
  async function calAddLead(inv, after){ return bookingAddLead("calendly", inv.id, inv.name || inv.email, after); }
  async function bookingAddLead(kind, id, name, after){
    if (!canEdit()) return toast("You can view the CRM but not add leads.");
    const v = await askForm(`Add ${name} as a new lead`, `<p class="muted" style="margin:0;font-size:14px">Adds a lead the usual way (source: Inbound / booking form, owner: you). The Gatekeeper checks it. Their bookings are linked to it, their booking email fills the lead's email, and it gets a "Consult scheduled" opportunity.</p>
      <div class="field"><label>Name</label><input name="name" value="${esc(name || "")}" required></div>`, "Add the lead");
    if (!v || !v.name.trim()) return;
    const { data, error } = await sb.from("leads").insert({ name: v.name.trim(), source: "Inbound / booking form", stage: "New", owner: S.me.id }).select("id,gate").single();
    if (error) return toast("Couldn't add it: " + error.message);
    const { error: le } = await sb.rpc("booking_link_lead", { p_kind: kind, p_id: id, p_lead: data.id });
    toast(le ? `Added the lead, but couldn't link the booking: ${le.message}` : `Added ${v.name.trim()}. The Gatekeeper says ${data.gate}.`);
    after?.(data.id);
  }
  // "Same person": a name-only match a person confirms. Links the booking (and the same email's others) and gives the lead its deal.
  async function bookingLink(kind, id, lead, name, after){
    if (!canEdit()) return toast("You can view the CRM but not link bookings.");
    if (!(await askForm(`Link to ${name}?`, `<p class="muted" style="margin:0;font-size:14px">Same name or pen name, different or no email. Link this booking to <b>${esc(name)}</b> only if it's the same person.</p>`, "Yes, same person"))) return;
    const { error } = await sb.rpc("booking_link_lead", { p_kind: kind, p_id: id, p_lead: lead });
    toast(error ? "Couldn't link it: " + error.message : `Linked to ${name}.`); if (!error) after?.(lead);
  }
  // A right-hand drawer (Today and Calendar): the booking on top, then the lead record when the booker is a lead.
  function drawer(title){
    let d = document.getElementById("drawer");
    if (!d) { d = document.createElement("aside"); d.id = "drawer"; d.setAttribute("aria-label", "Details"); document.body.appendChild(d);
      addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("drawer") && !document.getElementById("dlg")) document.getElementById("drawer")?.remove(); }); }
    delete d.dataset.task; delete d.dataset.cons;   // v6.58: the panel's keyboard nav belongs to what it shows now
    d.innerHTML = `<header><h3>${esc(title)}</h3><button class="btn sm" type="button" data-x aria-label="Close">✕</button></header><div class="dbody"></div>`;
    d.querySelector("[data-x]").onclick = () => d.remove();
    return d.querySelector(".dbody");
  }
  async function calOpen(inv, again){
    const body = drawer(inv.name || inv.email || "Booking");
    body.innerHTML = calCard(inv, { open: true, showName: false }) + (inv.lead ? `<div class="inline" style="gap:8px"><a class="btn sm primary" href="#lead/${inv.lead}">Open the full lead</a>${inv.call ? `<a class="btn sm" href="#consults">Consults</a>` : ""}</div><div data-rec></div>`
      : `<section class="panel" style="padding:10px 12px"><b>Booked, not in the CRM</b><p class="muted" style="margin:4px 0 8px;font-size:14px">${inv.lead_match_note ? esc(inv.lead_match_note) + "." : "Not linked to a lead yet (the booking sync adds bookers within 15 minutes; practice and test bookings are left out)."}</p>${canEdit() && inv.lead_suggested ? `<button class="btn sm primary" data-link>Same person: link</button> ` : ""}${canEdit() ? `<button class="btn sm" data-add>Add as a new lead</button>` : ""}</section>`);
    body.querySelector("[data-add]")?.addEventListener("click", () => calAddLead(inv, () => { S.calUsers = null; again?.(); body.closest("#drawer")?.remove(); }));
    body.querySelector("[data-link]")?.addEventListener("click", () => bookingLink("calendly", inv.id, inv.lead_suggested, "the matching lead", () => { again?.(); body.closest("#drawer")?.remove(); }));
    if (inv.lead) leadRecord(body.querySelector("[data-rec]"), inv.lead, { mode: "pane", tab: "overview" });
  }
  // A calls row logged by hand (no Calendly booking) in the drawer: the consult, then the lead record.
  function callOpen(c){
    const body = drawer(c.leads?.name || "Consult");
    body.innerHTML = `<div class="cal-card" style="--host:${esc(calTeamColor(c.host))}"><div class="t"><b>${esc(fmtET(c.starts_at))}</b><span class="pill" style="font-size:12px">${esc(c.status)}</span></div>
      <div>${esc(c.call_type || "Consult")} · logged by hand in the CRM</div><div class="muted" style="font-size:13.5px"><span class="cal-dot"></span> ${c.host ? "with " + esc(S.team[c.host] || "") : "no host set"}${c.meet_link ? ` · <a href="${esc(c.meet_link)}" target="_blank" rel="noopener noreferrer">Meet link</a>` : ""}</div></div>
      <div class="inline" style="gap:8px"><a class="btn sm primary" href="#lead/${c.lead}">Open the full lead</a><a class="btn sm" href="#consults">Consults</a></div><div data-rec></div>`;
    if (c.lead) leadRecord(body.querySelector("[data-rec]"), c.lead, { mode: "pane", tab: "overview" });
  }

  // ---------- Calendar (v6.31; Kyle Thu 19 Nov 2026: "it should have a calendar, too, with all the people in different colors with their
  // meeting times") ----------
  // Week view by default, with Day and Month. Every Calendly meeting in its host's color (calendly_users.color), plus consults
  // logged by hand in the CRM (calls with no Calendly booking), outlined dashed in their host's color. The legend toggles people
  // (remembered per browser). Times and days in Eastern. Click a meeting: the booking and the lead in the right-hand drawer.
  const dAdd = (k, n) => { const d = new Date(k + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const dDow = k => new Date(k + "T12:00:00Z").getUTCDay();
  const dMon = k => dAdd(k, -((dDow(k) + 6) % 7));
  const etMin = iso => { const p = etParts(new Date(iso), { hour: "numeric", minute: "numeric", hourCycle: "h23" }); return (+p.hour % 24) * 60 + +p.minute; };
  const etHM = iso => { const p = etParts(new Date(iso), { hour: "numeric", minute: "2-digit" }); return `${p.hour}:${p.minute} ${p.dayPeriod}`; };
  async function calendarView(){
    await Promise.all([teamNames(), calUsers()]);
    let saved = {}; try { saved = JSON.parse(localStorage.getItem("bpf-calv") || "{}"); } catch {}
    const V = S.calv = S.calv || { view: ["day", "week", "month"].includes(saved.view) ? saved.view : "week", day: etToday(), hidden: new Set(saved.hidden || []), canceled: !!saved.canceled };
    const keep = () => { try { localStorage.setItem("bpf-calv", JSON.stringify({ view: V.view, hidden: [...V.hidden], canceled: V.canceled })); } catch {} };
    const days = V.view === "day" ? [V.day] : V.view === "week" ? [...Array(7)].map((_, i) => dAdd(dMon(V.day), i))
      : (() => { const first = V.day.slice(0, 8) + "01", st = dMon(first); return [...Array(42)].map((_, i) => dAdd(st, i)); })();
    const from = dAdd(days[0], -1) + "T00:00:00Z", to = dAdd(days[days.length - 1], 1) + "T23:59:59Z";
    const at = location.hash;
    const [evs, hand, syncLine] = await Promise.all([
      q("Calendly meetings", fetchAll(() => sb.from("calendly_events").select(CAL_EV + ",calendly_invitees(" + CAL_INV + ")").gte("start_at", from).lte("start_at", to).order("start_at"))),
      q("consults logged by hand", sb.from("calls").select("id,lead,starts_at,call_type,status,host,meet_link,source,leads(name)").is("calendly_event", null).gte("starts_at", from).lte("starts_at", to)).then(must),
      calSyncLine().catch(() => "")]);
    if (location.hash !== at) return;
    const inRange = new Set(days);
    // People for the legend: every Calendly host, then anyone with hand-logged consults who isn't one.
    const people = (S.calUsers || []).map(u => ({ key: u.team ? "t:" + u.team : "u:" + u.id, name: u.team ? (S.team[u.team] || u.name) : (u.name || "").split(" ")[0], color: u.color || CAL_GREY }));
    const items = [];
    evs.forEach(e => { const invs = e.calendly_invitees || [], inv = invs.find(i => i.status === "active") || invs[0]; if (!inv) return;
      const h = calHost((e.calendly_event_hosts || [])[0]), off = calState(inv, e)[2];
      items.push({ kind: "cal", key: h.team ? "t:" + h.team : "u:" + h.uid, color: h.color, start: e.start_at, end: e.end_at, off, who: h.name,
        title: inv.name || inv.email || "Someone", sub: e.name, inLead: !!inv.lead, open: () => calOpen({ ...inv, calendly_events: e }, () => calendarView()) }); });
    hand.forEach(c => { const key = "t:" + (c.host || "none");
      if (!people.some(p => p.key === key)) people.push({ key, name: c.host ? S.team[c.host] || "Someone" : "No host", color: calTeamColor(c.host) });
      items.push({ kind: "hand", key, color: calTeamColor(c.host), start: c.starts_at, end: new Date(new Date(c.starts_at).getTime() + 30 * 6e4).toISOString(),
        off: /^Canceled/.test(c.status), who: c.host ? S.team[c.host] : "", title: c.leads?.name || "Someone", sub: (c.call_type || "Consult") + " · logged by hand", inLead: true, open: () => callOpen(c) }); });
    const shown = items.filter(x => inRange.has(etDate(x.start)) && !V.hidden.has(x.key) && (V.canceled || !x.off));
    const nOff = items.filter(x => inRange.has(etDate(x.start)) && x.off && !V.hidden.has(x.key)).length;
    const title = V.view === "day" ? fmtDate(V.day) : V.view === "week" ? `${fmtDate(days[0])} – ${fmtDate(days[6])}`
      : (p => `${p.month} ${p.year}`)(etParts(new Date(V.day.slice(0, 8) + "15T12:00:00Z"), { month: "long", year: "numeric" }));
    const tip = x => `${etHM(x.start)} · ${x.title} · ${x.sub}${x.who ? " · with " + x.who : ""}${x.off ? " · canceled" : ""}${x.inLead ? "" : " · not in the CRM"}`;
    let grid = "";
    if (V.view === "month") {
      grid = `<div class="calv-mo">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<div style="min-height:0;font-weight:600;font-size:13px;background:var(--zebra);border-top:0">${d}</div>`).join("")}
        ${days.map(k => { const list = shown.filter(x => etDate(x.start) === k).sort((a, b) => new Date(a.start) - new Date(b.start));
          return `<div class="${k.slice(0, 7) !== V.day.slice(0, 7) ? "out" : ""} ${k === etToday() ? "today" : ""}"><button class="dn" data-day="${k}" title="Open ${esc(fmtDate(k))}">${+k.slice(8)}</button>
            ${list.slice(0, 3).map(x => `<button class="calv-chip ${x.off ? "off" : ""}" data-it="${items.indexOf(x)}" title="${esc(tip(x))}"><span class="cal-dot" style="--host:${esc(x.color)}${x.kind === "hand" ? ";background:transparent;border:2px dashed " + esc(x.color) : ""}"></span>${esc(etHM(x.start).replace(":00", ""))} ${esc(x.title)}</button>`).join("")}
            ${list.length > 3 ? `<button class="dn muted" data-day="${k}">+${list.length - 3} more</button>` : ""}</div>`; }).join("")}</div>`;
    } else {
      const ins = shown.map(x => ({ x, s: etMin(x.start), e: Math.max(etMin(x.start) + 15, etMin(x.end) || 0) }));
      const minH = Math.min(8, ...ins.map(o => Math.floor(o.s / 60))), maxH = Math.max(19, ...ins.map(o => Math.ceil(o.e / 60)));
      const HH = V.view === "day" ? 52 : 44, ht = (maxH - minH) * HH;
      const col = k => { const list = ins.filter(o => etDate(o.x.start) === k).sort((a, b) => a.s - b.s || b.e - a.e);
        // side-by-side lanes for meetings that overlap
        const lanes = []; list.forEach(o => { let l = lanes.findIndex(end => end <= o.s); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = o.e; o.l = l; });
        list.forEach(o => { o.n = Math.max(...list.filter(p => p.s < o.e && p.e > o.s).map(p => p.l)) + 1; });
        const now = k === etToday() ? etMin(new Date().toISOString()) : null;
        return `<div class="calv-col ${k === etToday() ? "today" : ""}" style="height:${ht}px">${now != null && now >= minH * 60 && now <= maxH * 60 ? `<div class="calv-now" style="top:${(now - minH * 60) / 60 * HH}px"></div>` : ""}
          ${list.map(o => `<button class="calv-ev ${o.x.off ? "off" : ""} ${o.x.kind === "hand" ? "hand" : ""}" data-it="${items.indexOf(o.x)}" title="${esc(tip(o.x))}" style="--c:${esc(o.x.color)};top:${(o.s - minH * 60) / 60 * HH + 1}px;height:${Math.max(18, (o.e - o.s) / 60 * HH - 2)}px;left:calc(${o.l / o.n * 100}% + 2px);width:calc(${100 / o.n}% - 4px)">
            <b>${esc(etHM(o.x.start).replace(":00", ""))}</b> ${esc(o.x.title)}${V.view === "day" ? ` · ${esc(o.x.sub)}${o.x.who ? " · with " + esc(o.x.who) : ""}` : ""}${o.x.inLead ? "" : " ·<span title='Not in the CRM'> new</span>"}</button>`).join("")}</div>`; };
      grid = `<div class="calv-wk" style="--hh:${HH}px;grid-template-columns:52px repeat(${days.length},minmax(0,1fr))"><div class="hd"><div style="border-left:0"></div>${days.map(k => `<div class="${k === etToday() ? "today" : ""}">${V.view === "week" ? `<button class="dn" data-day="${k}" style="border:0;background:none;font:inherit;color:inherit;cursor:pointer">${esc(fmtDate(k))}</button>` : esc(fmtDate(k))}</div>`).join("")}</div>
        <div class="calv-gut" style="height:${ht}px">${[...Array(maxH - minH)].map((_, i) => i ? `<span style="top:${i * HH}px">${((minH + i + 11) % 12) + 1} ${minH + i < 12 ? "AM" : "PM"}</span>` : "").join("")}</div>${days.map(col).join("")}</div>`;
    }
    const main = document.getElementById("main");
    main.innerHTML = `<div class="view" style="gap:10px">
      <div class="calv-bar"><h2 style="margin:0;font-size:22px">Calendar</h2><button class="btn sm" data-go="today">Today</button><button class="btn sm" data-go="-1" aria-label="Earlier">‹</button><button class="btn sm" data-go="1" aria-label="Later">›</button>
        <b style="font-size:16px">${esc(title)}</b><span style="flex:1"></span>
        <label class="muted" style="font-size:13.5px;display:inline-flex;gap:5px;align-items:center"><input type="checkbox" id="calvOff" ${V.canceled ? "checked" : ""}> Show canceled${nOff && !V.canceled ? ` (${nOff})` : ""}</label>
        <span class="seg" role="group" aria-label="View">${[["day", "Day"], ["week", "Week"], ["month", "Month"]].map(([k, l]) => `<a href="#" data-v="${k}" ${V.view === k ? 'aria-current="true"' : ""}>${l}</a>`).join("")}</span></div>
      <div class="calv-legend" aria-label="People (click to show or hide)">${people.map(p => `<button type="button" data-p="${esc(p.key)}" aria-pressed="${!V.hidden.has(p.key)}" title="Show or hide ${esc(p.name)}'s meetings"><span class="cal-dot" style="--host:${esc(p.color)}"></span>${esc(p.name)}</button>`).join("")}</div>
      ${syncLine}
      ${shown.length ? "" : `<p class="muted" style="margin:0">No meetings ${V.view === "day" ? "this day" : V.view === "week" ? "this week" : "this month"}${V.hidden.size ? " for the people shown" : ""}.</p>`}
      ${grid}
      ${instr("Solid: booked in Calendly · dashed outline: logged by hand in the CRM · “new”: not in the CRM yet · Eastern time. Click a name in the row above to show or hide that person's meetings.")}</div>`;
    main.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { const g = b.dataset.go;
      V.day = g === "today" ? etToday() : V.view === "day" ? dAdd(V.day, +g) : V.view === "week" ? dAdd(V.day, 7 * g) : (() => { const d = new Date(V.day.slice(0, 8) + "15T12:00:00Z"); d.setUTCMonth(d.getUTCMonth() + +g); return d.toISOString().slice(0, 10); })();
      calendarView(); });
    main.querySelectorAll("[data-v]").forEach(a => a.onclick = e => { e.preventDefault(); V.view = a.dataset.v; keep(); calendarView(); });
    main.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { V.day = b.dataset.day; V.view = "day"; keep(); calendarView(); });
    main.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { const k = b.dataset.p; V.hidden.has(k) ? V.hidden.delete(k) : V.hidden.add(k); keep(); calendarView(); });
    main.querySelector("#calvOff").onchange = e => { V.canceled = e.target.checked; keep(); calendarView(); };
    main.querySelectorAll("[data-it]").forEach(b => b.onclick = () => items[+b.dataset.it]?.open());
  }

  // ---------- Upcoming consults (v6.39-; migrations 0077 and 0078) ----------
  // Kyle, Thu 19 Nov 2026: replace Janis and Rebekah's "Consult Calls" Google Doc (never edited by the CRM) "as sensibly as
  // possible", and "Ideally, this will be something that Janis no longer has to do": Claude runs it, a person checks it.
  // One card per consult, grouped by day (Eastern): flag (a person's, else Claude's suggestion, marked AI), booking page, time,
  // who takes it, prep status, links, guests, history line, reason in red, routing notice, answers folded. Everything works for
  // bookings with no lead, and the CRM details (consult_bookings) are keyed on the first booking of a reschedule chain, so they

  // v6.61 outcome form, from the row's Record outcome button, the "⋯" menu and the panel (no jump to another tab). Step 1: did it
  // happen (Held / No-show / Canceled by them / by us); step 2 if Held: Won / Follow up / Lost. Then the program, a call note, the

  const outKeyOf = c => !c ? null : c.status === "No-show" ? "noshow" : /^Canceled by client/.test(c.status) ? "cancel_them" : /^Canceled by us/.test(c.status) ? "cancel_us"

  async function consOutcome(x, again, pre){

    if (!L) return toast("Couldn't load the lead.");
    const deal = (deals || []).find(o => o.id === c.opportunity) || (deals || []).find(o => ["In progress", "Stalled"].includes(o.status)) || (deals || [])[0] || null;

    const fu3 = dAdd(etToday(), 3), fu2 = dAdd(etToday(), 2);
    // v6.63 Confirm on Claude's suggestion: recorded at once as the signed-in person, unless it needs a choice (Lost needs why; Held with no result)
    const wonMissing = pre?.res === "won" && !((pre.program || deal?.program) && Number(deal?.potential_value) > 0);   // v6.69: Won needs program and amount
    if (pre?.direct && pre.hap && !(pre.hap === "held" && (!pre.res || pre.res === "lost")) && !(pre.hap === "held" && wonMissing)) {

    const radio = (name, k, l, cur) => `<label style="display:inline-flex;gap:5px;align-items:center;margin-right:12px;font-size:15px"><input type="radio" name="${name}" value="${k}" ${cur === k ? "checked" : ""}> ${l}</label>`;

  async function vettingView(listId){
    await Promise.all([teamNames(), loadBadMail()]);
    const { data: batches, error } = await sb.from("research_batches").select("*").or("purpose.is.null,purpose.neq.Blind test").order("created_at", { ascending: false });
    if (error) throw error;
    const bn = Object.fromEntries((batches || []).map(x => [x.id, x]));
    const inQueue = r => bn[r.batch] && r.research_status !== "Not researched" && !r.lead && r.decision === "Waiting" && (!listId || r.batch === listId);
    const all = Object.keys(bn).length ? await fetchAll(() => sb.from("research_rows").select("*").in("batch", Object.keys(bn)).neq("research_status", "Not researched").is("lead", null).eq("decision", "Waiting").order("row_number")) : [];
    const rows = all.filter(inQueue);
    const dets = rows.length ? await fetchAll(() => sb.from("author_details").select("research_row").in("research_row", rows.map(r => r.id))) : [];
    // v6.96 (Research / Qualify split, step 3): each author's next step (qualify_status), and the Qualify queue
    const NS = {}; if (rows.length) (await fetchAll(() => sb.from("qualify_status").select("*").in("research_row", rows.map(r => r.id)))).forEach(x => NS[x.research_row] = x);
    const nextStep = r => { const x = NS[r.id]; if (!x) return "";
      return x.next_step === "In line for Amazon" && x.place_in_line ? `In line for Amazon (#${x.place_in_line})`
        : x.next_step === "Claude is checking" && x.pages_planned ? `Claude is checking (page ${Math.min(x.pages_done + 1, x.pages_planned)} of ${x.pages_planned})` : x.next_step; };
    const NS_TIP = { "Needs ranks": "Tick it and click Check Amazon ranks (Claude reads them, slowly), or Add ranks yourself, or send a screenshot.",
      "In line for Amazon": "Waiting for Claude's Amazon check. Take out of line to stop it.", "Claude is checking": "Claude is reading this author's Amazon pages now, one about every 5 minutes.",
      "Needs a program": "Ranks are on file. Pick the Program, then Approve.", "Check, then approve": "A program is on the row (Claude's suggestion or a person's pick). Check the row, then Approve or Disqualify.",
      "Maybe trad: check": "Research found a traditional publisher. Check it: Disqualify (Traditional), or change Trad or indie to Indie or Hybrid and it moves on to ranks.",
      "Not sure who this is": "Research couldn't tell who this is. Look yourself, or Disqualify.",
      "Amazon check paused": "Amazon showed a robot check, so Claude stopped. Kyle resumes it.", "No Amazon page found": "Claude found no Amazon author page. Add ranks by hand, or Disqualify." };
    const dn = {}; dets.forEach(x => dn[x.research_row] = (dn[x.research_row] || 0) + 1);
    const lists = {}; all.forEach(r => lists[r.batch] = (lists[r.batch] || 0) + 1);
    // Confidence (Kyle, Thu 12 Nov 2026: "a percent confidence column … how confident you are that every field in the row is
    // accurate, based on the scores … from the tests"). Each filled field gets Claude's blind-test accuracy for that kind
    // of field, smoothed for the small sample ((right + 1) / (scored + 2)); the row's confidence is their product.
    const { data: rates } = await sb.from("research_success_rates").select("task,scored,right");
    const RATE = {}; (rates || []).forEach(x => RATE[x.task] = { p: ((x.right || 0) + 1) / ((x.scored || 0) + 2), n: x.scored || 0, ok: x.right || 0 });
    const CONF_FIELDS = [["Program", r => r.program_confirmed ? null : (r.f || {}).tier_suggested], ["Trad or indie", r => (r.f || {}).publishing_type],
      ["Best series", r => (r.f || {}).best_series], ["Email", r => (r.f || {}).email], ["Website", r => (r.f || {}).website],
      ["Facebook", r => (r.f || {}).facebook], ["Instagram", r => (r.f || {}).instagram], ["Amazon author page", r => (r.f || {}).amazon_author_page]];
    const confTip = r => { const c = conf(r); if (!c) return "";
      const weak = c.parts.reduce((a, b) => b[1].p < a[1].p ? b : a);
      return c.parts.map(([t, x]) => `${t}: ${Math.round(x.p * 100)}% (right ${x.ok} of ${x.n} in tests)`).join("\n") + `\nWeakest: ${weak[0]}. Multiplied together: ${Math.round(c.p * 100)}%.`; };
    const conf = r => { const parts = CONF_FIELDS.filter(([t, g]) => g(r) && RATE[t]).map(([t]) => [t, RATE[t]]);
      if (!parts.length) return null; return { p: parts.reduce((a, [, x]) => a * x.p, 1), parts }; };
    const b = { name: listId && bn[listId] ? "Qualify: " + bn[listId].name : "Qualify" };
    const { count: newN } = await sb.from("leads").select("id", { count: "exact", head: true }).eq("status", "new").is("merged_into", null);
    const QHELP = instr(`<b>The steps:</b> 1. <b>Needs ranks</b>: tick authors and click <b>Check Amazon ranks</b> (Claude reads them on Amazon, about one page every 5 minutes, so a few authors a day), or use <b>Add ranks</b> yourself. 2. <b>Needs a program</b>: pick the Program. 3. <b>Check, then approve</b>: look the row over and click <b>Approve</b> (it goes into the CRM as Qualified) or <b>Disqualify</b>. <span class="ai-key">Yellow outline</span> = Claude filled it in (hover to see where from). <span class="bad-key">Red outline</span> = needs you. Type over anything that's wrong.`);
    S.rRows = rows; S.rCheck = {};
    const ck = r => r.batch + ":" + r.row_number;
    const E = canEdit();
    const counts = () => { const c = { n: rows.length, trad: 0, cant: 0, rank: 0 }; rows.forEach(r => {
      if (r.research_status === "Not a fit (trad)") c.trad++; if (r.research_status === "Can't tell who this is") c.cant++; if (r.research_status === "Rank needed") c.rank++; }); return c; };
    const head = () => { const c = counts(); return `<div class="inline" style="gap:10px;flex-wrap:wrap;align-items:baseline">
        <h2 style="margin:0;font-size:22px">Qualify</h2>
        <select id="rPick" style="padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)"><option value="">All lists (${all.length})</option>${Object.keys(lists).map(k => `<option value="${k}" ${k === listId ? "selected" : ""}>${esc(bn[k].name)} (${lists[k]})</option>`).join("")}</select></div>
      <p class="muted" style="margin:4px 0 0">${c.n ? `${c.n} author${c.n === 1 ? "" : "s"} researched and waiting for you.` : "Nobody is waiting for you here."}${newN ? ` <a href="#research">${newN} lead${newN === 1 ? " isn't" : "s aren't"} researched yet: go to Research.</a>` : ""}</p>
`; };
    document.getElementById("main").innerHTML = `<style>.ai-key{box-shadow:inset 0 0 0 2px var(--ai-line);padding:0 5px;border-radius:3px}.bad-key{box-shadow:inset 0 0 0 2px var(--bad);padding:0 5px;border-radius:3px}</style><div class="view" style="gap:10px"><div id="rhead">${head()}</div><div id="rsheet"></div><div>${QHELP}</div></div>`;
    const wirePick = () => document.getElementById("rPick")?.addEventListener("change", e => location.hash = "#vetting" + (e.target.value ? "/" + e.target.value : ""));
    wirePick();
    // v6.63: the Human / H+AI / AI switch applies here too (it was ignored): Human blanks Claude's findings, AI shows them plain.
    const fcol = ([k, label, type, more]) => ({ key: "f." + k, label, type: type || "text", editable: E, get: r => aiView("lead_research").hide && (r.ai || {})[k] ? (type === "check" ? false : "") : (r.f || {})[k] ?? (type === "check" ? false : ""), ...(more || {}) });
    // Vetting order (Kyle, Thu 12 Nov: "there may be some columns that are unnecessary for our purposes"): what a vetter
    // checks, left to right. The rest stay available from the column menu (Hidden columns) but start hidden.
    const F = k => fcol(R_FIELDS.find(x => x[0] === k));
    const cols = [
      { key: "row_number", label: "Row", type: "number", width: 60 },
      { key: "_next", label: "Next step", width: 190, get: r => nextStep(r) },
      { key: "_ranks", label: "Ranks", width: 110, get: r => { const x = NS[r.id]; return x && x.ranks_on_file ? `${x.ranks_on_file} · ${fmtDate(x.last_rank_on).replace(/ \d{4}$/, "")}` : ""; } },
      { key: "name", label: "Author", width: 200 },
      { key: "_list", label: "List", width: 170, get: r => bn[r.batch]?.name || "" },
      F("amazon_author_page"),   // right after List: it's the page a vetter opens first to check the row (Kyle, Thu 12 Nov 2026)
      // One Program column, filled with Claude's suggestion; the vetter changes it only to disagree (saved as their call).
      { key: "program_confirmed", label: "Program", type: "select", options: PROGRAMS, editable: E, width: 150, get: r => r.program_confirmed || (r.research_status === "Rank needed" ? "Waiting on screenshot" : (r.f || {}).tier_suggested || ""),
        hint: "Claude's suggestion until you change it. Approve uses what's here. \"Waiting on screenshot\": the program depends on Amazon ranks; add the screenshot (Claude records the ranks) or pick the program yourself." },
      F("tier_reason"),
      { key: "_conf", label: "Confidence", type: "percent", width: 110, get: r => { const c = conf(r); return c ? Math.round(c.p * 100) : null; },
        hint: "How likely every filled-in field in this row is right, from Claude's blind-test accuracy per field. Hover a number to see each field." },
      // Needs: blank unless something needs a person (in this queue everything is researched).
      { key: "_needs", label: "Needs", width: 140, get: r => ({ "Rank needed": "Waiting on screenshot", "Can't tell who this is": "Couldn't identify", "Not a fit (trad)": "Looks trad" })[r.research_status] || "" },
      F("publishing_type"), F("best_series"), F("book_count"),
      F("email"), { key: "email_checked", label: "Email checked", type: "check", editable: E, get: r => !!r.email_checked, hint: "Tick once you've confirmed the address is really theirs (on their site, or from their newsletter). It goes into the CRM as Verified." },
      F("newsletter_signup"),   // what happened with the author's newsletter (signed up, waiting, sender) (audit F3/P5)
      F("website"), F("facebook"), F("instagram"),
      F("socials_searched"),    // which Facebook / Instagram searches Claude ran when one is empty
      { key: "_details", label: "Author details", type: "number", get: r => dn[r.id] || 0, hint: "Facts Claude found about the author (awards, bestseller claims, sales numbers…), each with its link. Right-click the row, or press Space then the button, to read them." },
      { key: "not_fit_reason", label: "Not a fit because", type: "select", options: NOT_Q_OPTS, editable: E, get: r => r.not_fit_reason || "" }, { key: "vetting_note", label: "Vetting note", type: "long", editable: E, get: r => r.vetting_note || "" }, { key: "_vetted", label: "Vetted", get: r => r.vetted_at ? `${S.team[r.vetted_by] || "Someone"}, ${fmtDate(r.vetted_at)}` : "" },
      { key: "genre", label: "Genre" }, { key: "_check", label: "CRM check", get: r => r.lead ? "In the CRM" : (S.rCheck[ck(r)] || ""), hint: "Click Check against the CRM to see the Gatekeeper and whether the author is already a lead." },
      F("tier_suggested"), { key: "research_status", label: "Research status", type: "select", options: R_STATUS, editable: E },
      F("publisher"), F("best_series_standalone"), F("series_count"), F("tier_alt"), F("website_contact_page"), F("pen_names"), F("rank_notes"), F("not_qualified_reason"),
      { key: "note", label: "Claude's note", type: "long", editable: E },
    ];
    // Qualify / Disqualify: vets the rows and puts them into the CRM straight away.
    async function vetRows(sel, d, reason = null){
      const ids = sel.filter(r => !(r.lead && d === "Leave out")).map(r => r.id); if (!ids.length) return "Nothing to change.";
      const { data, error } = await sb.rpc("vet_research_rows", { p_ids: ids, p_decision: d, p_reason: reason });
      if (error) return `Couldn't save that decision: ${error.message}`;
      const { data: fresh } = await sb.from("research_rows").select("*").in("id", ids);
      (fresh || []).forEach(f => { const r = rows.find(x => x.id === f.id); if (r) Object.assign(r, f); });
      for (let i = rows.length - 1; i >= 0; i--) if (!inQueue(rows[i])) rows.splice(i, 1);   // decided: leaves the queue
      api.setRows(rows); document.getElementById("rhead").innerHTML = head(); wirePick();
      const imp = (data?.imports || []).reduce((a, x) => ({ n: a.n + (x.new || 0), m: a.m + (x.matched || 0) }), { n: 0, m: 0 });
      toast(d === "Approved" ? `Qualified ${ids.length}: in the CRM as Qualified${imp.n ? ` (${imp.n} new leads)` : ""}, ready for outreach.`
        : d === "Not a fit" ? `Disqualified ${ids.length}. They're in All leads as Disqualified, with the reason, so they won't be researched again.`
        : d === "Leave out" ? `Left out ${ids.length}.` : `Back to waiting.`);
      return "";
    }
    const api = S.rSheet = Sheet.create(document.getElementById("rsheet"), {
      id: "vetting_rows_v8", label: b.name, columns: cols, rows, rowKey: r => r.id, remember: true, views: viewStore("vetting_rows_v8"), toast, fileName: b.name,
      defaults: { frozen: 2, sort: [{ key: "row_number", dir: "asc" }],
        hidden: ["row_number", "genre", "_check", "f.tier_suggested", "research_status", "_vetted", "_details", "not_fit_reason", "vetting_note", "_needs", "email_checked", "f.publisher", "f.best_series_standalone", "f.series_count", "f.tier_alt", "f.website_contact_page", "f.pen_names", "f.rank_notes", "f.not_qualified_reason", "note"] },
      bulkAlways: true,
      onOpen: r => showDetails(r.name, { research_row: r.id }), openLabel: "See books, ranks and author details",
      cellTip: (r, col) => col.key === "_conf" ? confTip(r) : col.key === "_next" ? (NS_TIP[(NS[r.id] || {}).next_step] || "") : [rNeeds(r, col), rAiTip(r, col)].filter(Boolean).join("\n"),
      cellClass: (r, col) => [aiView("lead_research").cls && rAiTip(r, col) ? "ai" : "", rNeeds(r, col) ? "bad" : ""].join(" "), rowClass: r => r.lead ? "muted" : "",
      onEdit: async changes => {

        await inBatches(Object.values(by), 8, async ({ r, patch }) => {
          if ("decision" in patch) { decide.push({ r, d: patch.decision || "Waiting" }); delete patch.decision; }
          if (r.lead && Object.keys(patch).some(k => !V_KEYS.includes(k))) return errs.push(`${r.name} is already in the CRM; change its facts there (the vetting columns can still change here)`);
          if (!Object.keys(patch).length) return;
          const up = {}; let f = null, ai = null;
          for (const [k, v] of Object.entries(patch)) {
            if (k.startsWith("f.")) { f = f || { ...(r.f || {}) }; ai = ai || { ...(r.ai || {}) }; const kk = k.slice(2);
              if (v === "" || v == null) delete f[kk]; else f[kk] = v; delete ai[kk]; }   // typed by a person: no longer Claude's
            else up[k] = v;
          }
          if (f) { up.f = f; up.ai = ai; }
          // v6.97 (Kyle: "looks trad seems weird, since it could be proven wrong"): a person changing Trad or indie to Indie or
          // Hybrid on a "Maybe trad" row moves it on to ranks
          if (f && r.research_status === "Not a fit (trad)" && ["Indie", "Hybrid", "Small press"].includes(f.publishing_type)) up.research_status = "Researched";
          const { data, error } = await sb.from("research_rows").update(up).eq("id", r.id).eq("version", r.version).select("*");
          if (error) return errs.push(`${r.name}: ${error.message}`);
          if (!data?.length) { const { data: fresh } = await sb.from("research_rows").select("*").eq("id", r.id).maybeSingle(); if (fresh) Object.assign(r, fresh);
            return errs.push(`${r.name} changed just now (Claude may still be working on it), so that change wasn't saved. Make it again`); }
          Object.assign(r, data[0]);
          if (r.lead && ["Approved", "Not a fit"].includes(r.decision)) decide.push({ r, d: r.decision });   // re-apply to the lead
        });
        for (const d of [...new Set(decide.map(x => x.d))]) { const err = await vetRows(decide.filter(x => x.d === d).map(x => x.r), d); if (err) errs.push(err); }
        api.setRows(rows); document.getElementById("rhead").innerHTML = head(); wirePick();
        if (errs.length) throw new Error(errs.slice(0, 2).join(". ") + (errs.length > 2 ? ` (and ${errs.length - 2} more)` : ""));
      },

            : !sel.some(r => (NS[r.id] || {}).next_step === "Needs ranks") ? "None of the ticked authors need ranks"

        // Add ranks (CRM audit U5): a vetter types the Kindle rank they saw for a book. One book_ranks row each, with their

              <div class="field"><label>Kindle Store rank (#)</label><input name="rank" type="number" min="1" step="1" required></div>
              <div class="field"><label>Category (optional)</label><input name="cat" placeholder="e.g. Paranormal Romance"></div>
              <div class="field"><label>Rank in that category (optional)</label><input name="catrank" type="number" min="1" step="1"></div>
              <div class="field"><label>Date you saw it</label><input name="seen" type="date" required value="${todayISO()}" max="${todayISO()}"></div>
              <div class="field"><label>Link to the page (optional)</label><input name="url" type="url"></div>`, "Save the rank");
            if (!v) return;
            const { error } = await sb.rpc("add_book_rank", { p_research_row: r.id, p_lead: null, p_title: v.title, p_rank: parseInt(v.rank, 10),
              p_seen_on: v.seen, p_source_url: v.url || null, p_top_category: v.cat || null, p_top_category_rank: v.catrank ? parseInt(v.catrank, 10) : null });
            if (error) return toast("Couldn't save the rank: " + error.message);
            toast(`Saved: ${v.title} at #${Number(v.rank).toLocaleString()}. Add the next book, or pick the Program and Approve.`);
          } },
        { label: "Disqualify", run: sel => {   // asks for the reason with a small picker
            document.getElementById("nfPick")?.remove();
            const box = document.createElement("div"); box.id = "nfPick";
            box.style.cssText = "position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:50;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18);max-width:420px";
            box.innerHTML = `<b>Why disqualify ${sel.length > 1 ? `these ${sel.length} authors` : esc(sel[0].name)}?</b><div class="inline" style="flex-wrap:wrap;gap:6px;margin-top:10px">${NOT_Q_OPTS.map(x => `<button class="btn sm" data-r="${esc(x)}">${esc(x)}</button>`).join("")}</div><div style="margin-top:10px"><button class="btn sm" data-x>Cancel</button></div>`;
            document.body.appendChild(box);
            box.onclick = async e => { const t = e.target.closest("button"); if (!t) return; box.remove(); if (t.dataset.x !== undefined) return;
              const err = await vetRows(sel, "Not a fit", t.dataset.r); if (err) toast(err); };   // stored as Not a fit; the lead shows Disqualified
          } },
      ] : [],
      toolbar: el => { if (!E) return;
        el.innerHTML = "";
      },
    });
    // The Gatekeeper runs on the queue by itself (Kyle, Thu 12 Nov 2026: no "Check against the CRM" button). Only problems
    // show: a red outline on the author's name, with the reason on hover.
    (async () => { for (const bt of [...new Set(rows.map(r => r.batch))]) {
        const { data: d, error } = await sb.rpc("research_check", { p_batch: bt });
        if (error) { toast(`Couldn't run the Gatekeeper check on ${bn[bt]?.name || "a list"}: ${error.message}. Don't qualify from it until it runs.`); continue; }
        const mine = new Set(rows.filter(r => r.batch === bt).map(r => r.row_number));
        (d || []).filter(x => mine.has(x.row)).forEach(x => { const what = x.result === "New" ? "New lead" : x.result === "Check" ? "Check: " + (x.why || "") : "Already a lead";
          S.rCheck[bt + ":" + x.row] = `${what}${x.gate ? " · Gatekeeper: " + x.gate : ""}${x.gate_why ? " (" + x.gate_why + ")" : ""}`; });
      }
      // Authors already in the CRM: their lead's Gatekeeper hits give the reason.
      const ids = rows.map(r => r.src_lead).filter(Boolean);
      if (ids.length) { const { data: ls } = await sb.from("leads").select("id,gate,gate_hits").in("id", ids);
        (ls || []).filter(l => l.gate !== "Clear").forEach(l => { const r = rows.find(x => x.src_lead === l.id); if (!r) return;

          S.rCheck[r.batch + ":" + r.row_number] = `Gatekeeper: ${l.gate} (${why || "see the lead"})`; }); }
      if (api.el.isConnected) api.setRows(rows); })();
    // Live: Claude's saves show up as they happen.
    S.rChan?.unsubscribe();
    S.rChan = sb.channel("vetting").on("postgres_changes", { event: "*", schema: "public", table: "research_rows" }, p => {
      if (!api.el.isConnected) return S.rChan?.unsubscribe();
      const row = p.new || {}; const i = rows.findIndex(x => x.id === row.id); const r = rows[i];
      if (r) { if ((row.version ?? 0) >= (r.version ?? 0)) Object.assign(r, row); if (!inQueue(r)) rows.splice(i, 1); }

      api.setRows(rows); document.getElementById("rhead").innerHTML = head(); wirePick();

      const rr = p.new?.research_row; if (!rr || !rows.some(x => x.id === rr) || !api.el.isConnected) return;
      dn[rr] = (dn[rr] || 0) + 1; api.setRows(rows);
    }).subscribe();
  }

  // ---------- Testing area (v6.40; migration 0078; Kyle Thu 19 Nov 2026: "a testing area that we can use to check your guesses

  function cellText(ws, r, c){

  }
  function readSheet(){

  function buildRows(){
    U.rows = [];

      const g = U.grid[r], get = k => U.map[k] === undefined ? null : clean(g[U.map[k]]);
      const row = { row: r + 1, name: get("name"), amazon: get("amazon"), website: get("website"), email: get("email"), facebook: get("facebook"), instagram: get("instagram"),
        best_series: get("best_series"), contact_page: get("contact_page"), phone: get("phone"), note: get("note"), file: U.name + (U.wb.SheetNames.length > 1 ? " › " + U.sheet : ""),

  function guessNewList(){

  // A bad email: look for the real one on the author's own website (find-email helper).
  async function lookupEmails(){

    const blocked = new Set((U.preview||[]).filter(p => p.gate === "Blocked").map(p => p.row));
    const todo = U.rows.filter(r => (r.emailBad || (!r.email && U.kind === "contacts" && U.map.email !== undefined)) && r.website && !r.dupOf && !blocked.has(r.row) && !U.lookups[r.row]);

    };

  // The click-to-accept suggestions for a row: the helper's find first, then simple tidy-ups.
  function fixesFor(p){
    const src = p.src || {}, out = [...(src.fixes || [])];
    const look = U.lookups?.[p.row];
    if ((src.emailBad || !src.email) && look && U.map.email !== undefined) {
      const ec = U.map.email, i = out.findIndex(f => f.c === ec);
      const where = x => x.page.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "") + (x.how && x.how !== "on the page" ? `, ${x.how}` : "");
      const list = look.emails || [];
      // The author's own address (their domain, or Gmail and the like on their own site) first.
      const mine = list.find(x => x.kind === "own") || list.find(x => x.kind === "free") || list.find(x => !x.kind);
      // A publisher's, agent's or publicist's address is labelled as theirs, never as the author's.
      const rep = list.find(x => x.kind === "rep");
      if (mine) {
        const sure = mine.kind !== "free";
        const why = `${sure ? "Their own address" : "A free-mail address listed on their site"}: ${where(mine)}`;
        if (i >= 0 && out[i].v === mine.email) out[i] = { c: ec, v: mine.email, why: `Matches their website. ${why}`, strong: sure, web: true };
        else { if (i >= 0) out[i] = { ...out[i], why: out[i].why + " (their website shows a different address)" }; out.unshift({ c: ec, v: mine.email, why, strong: sure, web: true }); }
      }
      if (rep && !mine) out.push({ c: ec, v: rep.email, why: `Not the author: their ${rep.role || "representative"}${rep.org ? ` (${rep.org})` : ""}. ${where(rep)}`, web: true, rep: true });

  }
  async function runImport(listId, commit){
    const out = [], CH = 100, send = U.rows.filter(r => !r.dupOf).map(({problems, dupOf, dups, bad, fixes, emailBad, ...r}) => r);
    for (let i = 0; i < send.length; i += CH) {
      const { data, error } = await sb.rpc("import_list", { p_list: listId || null, p_rows: send.slice(i, i+CH), p_commit: commit, p_kind: U.kind, p_owner: U.owner || S.me.id });
      if (error) throw error;
      out.push(...data);
      const el = document.getElementById("uprog"); if (el) el.textContent = `${commit?"Importing":"Checking"} ${Math.min(i+CH, send.length)} of ${send.length} rows…`;
    }
    const byRow = Object.fromEntries(U.rows.map(r => [r.row, r]));
    const res = out.map(o => ({ ...o, src: byRow[o.row] || {} }));

  const uCell = (p, i) => String((U.grid[p.row-1]||[])[i] ?? "");

    const fieldFor = i => { const k = Object.keys(U.map).find(k => U.map[k] === i); return k ? ALLF.find(c => c[0] === k)[1] : null; };
    const colRows = head.map((h,i) => `<tr style="cursor:default"><td>${esc(colLabel(i))}</td><td class="mono">${filledN(i).toLocaleString()} of ${body.length.toLocaleString()}</td><td style="max-width:260px;overflow:hidden;text-overflow:ellipsis" title="${esc(example(i))}">${esc(example(i))}</td><td>${!filled(i) ? `<span class="muted">Empty in this file</span>` : fieldFor(i) ? `Saved to <b>${esc(fieldFor(i))}</b>, and kept on the lead under Came from` : skipped(i) ? `<span class="muted">Left out (not saved). It has no heading.</span>` : "Kept on the lead under Came from (not in a field)"}</td></tr>`).join("");
    const dataCols = head.map((_,i)=>i).filter(i => i !== U.map.name && (filled(i) || Object.values(U.map).includes(i)));   // an empty Email column still shows, so a found email can go in
    const kindLine = U.kind === "contacts" ? "A list with contact details filled in (from Carpe Diem)." : "A list of names only, ready for Carpe Diem.";
    const listLine = U.listId ? `Belongs to <b>${esc(list)}</b>${top?` (${top.matches.toLocaleString()} of ${U.rows.length.toLocaleString()} names are on it)`:""}.` : `A new list: <b>${esc(U.newList.name)}</b> (${esc(U.newList.source)}).`;
    const tabs = U.wb.SheetNames.filter(n => (U.wb.Sheets[n]["!ref"]||"A1") !== "A1");
    const nOk = probs.filter(uOk).length;
    const sumHtml = `<section class="panel"><header><h3>${U.done?"Imported: ":""}${esc(U.name)}</h3>${U.batch?`<a class="btn sm" href="#bringin">← Lists waiting to import</a>`:""}<button class="btn sm" id="uother">Upload a different file</button></header>
        ${tabs.length>1?`<div class="inline" style="margin-bottom:10px"><span class="muted">Tab:</span>${tabs.map(t=>`<button class="btn sm ${t===U.sheet?"primary":""}" data-tab="${esc(t)}">${esc(t)}</button>`).join("")}</div>`:""}
        <p>${kindLine} ${listLine}</p>
        ${(() => { const kept = P.filter(p => p.owner_kept), by = {}; kept.forEach(p => by[p.owner_kept] = (by[p.owner_kept]||0) + 1);
          const keptLine = kept.length ? `<span class="muted">${Object.entries(by).map(([n,k]) => `${k} already owned by ${esc(n)}`).join(", ")}: they keep their owner.</span>` : "";
          return U.done ? `<p style="margin-top:8px">Owner of the new leads: <b>${esc(S.team[U.owner]||"")}</b>. ${keptLine}</p>`
            : `<div class="inline" style="margin-top:10px"><label for="uowner">Owner of these leads:</label><select id="uowner">${Object.entries(S.team).sort((a,b)=>a[1].localeCompare(b[1])).map(([id,n]) => `<option value="${id}" ${id===U.owner?"selected":""}>${esc(n)}${id===S.me.id?" (you)":""}</option>`).join("")}</select>${keptLine}</div>`; })()}
        <div class="cards" style="margin-top:12px">
          ${fcard("look", probs.length, `to look at${nOk?` (${nOk} done, in green)`:""}`, probs.length?"hot":"")}
          ${blocked?fcard("blocked", blocked, "blocked by the Gatekeeper", "bad"):""}
          ${fcard("have", have.length, U.done?"leads updated":"leads we already have")}
          ${fcard("New", c("New"), U.done?"new leads added":"new leads")}
          ${c("Duplicate")?fcard("Duplicate", c("Duplicate"), "duplicate rows in the file (merged)"):""}
          ${U.kind==="contacts"?fcard("email", withEmail, "with an email"):""}
          ${fcard("all", P.length, "all rows")}
        </div>
        ${instr(`Click a box to see those rows. The sheet below works like Google Sheets: click a cell and type, copy and paste, drag the blue square to fill, sort by clicking a heading, and ${"⌘"}+Z to undo. Press ? for every shortcut. Fixed rows stay in "to look at" in green, and cells you changed or accepted are outlined green, so you can check them. Every column is saved. Details we already have are never overwritten, and the Gatekeeper checks every row.`)}
        <details style="margin-bottom:12px"><summary style="cursor:pointer">Where each of the ${head.length} columns goes</summary><div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Column in the file</th><th>Rows with a value</th><th>Example</th><th>In the CRM</th></tr></thead><tbody>${colRows}</tbody></table></div></details>
        ${U.done?`<div class="inline"><a class="btn primary" href="#leads?list=${U.listId}">See the leads</a><button class="btn" id="unext">Upload another list</button></div>`
          :`<div class="inline"><button class="btn primary" id="uimport">Import ${(c("Update")+c("Match")+c("New")).toLocaleString()} rows</button>${P.some(p => p.result !== "Duplicate" && fixesFor(p).some(f => !f.rep && (f.v || f.cs))) ? `<button class="btn" id="ufixall" title="Agents' and publicists' addresses are never filled in this way">Accept every suggestion (${P.filter(p => p.result !== "Duplicate" && fixesFor(p).some(f => !f.rep)).length} rows)</button>` : ""}<span id="uprog" class="muted"></span></div>`}
        ${U.done?"":`<details style="margin-top:14px"><summary class="muted" style="cursor:pointer">Not right? Change the list or the columns</summary><div id="ufix" style="margin-top:12px"></div></details>`}
      </section>`;
    // The sheet is made once per file (and again after the import, when it turns read-only); later checks only refresh its rows.
    const key = [U.name, U.sheet, U.done, U.map.name, dataCols.join(",")].join("|");
    if (!m.querySelector("#usum") || !U.sheetApi || !U.sheetApi.el.isConnected || U.gridKey !== key) {
      m.innerHTML = `<div class="view"><div id="usum"></div><div id="ugrid"></div></div>`;
      const keep = U.sheetApi ? U.sheetApi.changes() : (U.chg || {});
      U.gridKey = key;
      U.sheetApi = Sheet.create(m.querySelector("#ugrid"), {
        id: "upload", label: "Rows in the file", columns: uColumns(dataCols, filledN), rows, rowKey: p => p.row, toast, changes: keep,
        fileName: U.name.replace(/\.(xlsx|xls|csv)$/i, "") + " (checked)", height: "calc(100vh - 110px)",
        defaults: { frozen: 2, rowH: "medium", wrap: ["look"], sums: { row: "none", look: "filled", result: "unique" } },
        rowClass: p => uOk(p) ? "k-green" : "",
        cellClass: (p, col) => [/^c\d+$/.test(col.key) && (p.src.bad||[]).includes(+col.key.slice(1)) ? "bad" : "", aiTip(p, col) ? "ai" : ""].join(" "),
        cellTip: aiTip,
        onEdit: uploadEdits,
      });
    } else U.sheetApi.setRows(rows);
    U.chg = U.sheetApi.changes();
    m.querySelector("#usum").innerHTML = sumHtml;
    document.getElementById("ufixall")?.addEventListener("click", () => {
      // Every suggestion, but only the first (best) one for each cell.
      const edits = U.preview.filter(p => p.result !== "Duplicate").flatMap(p => { const seen = new Set();
        return fixesFor(p).filter(f => !f.rep).flatMap(f => { const cs = (f.cs || [f.c]).filter(c => !seen.has(c) && seen.add(c)); if (cs.length) markAi(p, { ...f, cs }); return cs.map(c => ({ row: p, key: "c" + c, value: f.v })); }); });
      U.sheetApi.edit(edits, { raw: true });
    });
    document.getElementById("uowner")?.addEventListener("change", async e => {
      U.owner = e.target.value;
      try { await runCheck(); } catch (err) { toast("Couldn't check the file: " + err.message); }
      renderSummary(m); toast(`${S.team[U.owner]} will own these leads.`);
    });
    m.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { U.filter = b.dataset.f; renderSummary(m); });
    document.getElementById("uother").onclick = pickFile;
    document.getElementById("unext")?.addEventListener("click", pickFile);
    document.getElementById("uimport")?.addEventListener("click", doImport);
    m.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { U.sheet = b.dataset.tab; U.preview = null; U.done = false; U.sheetApi = null; uploadView(); });
    const fix = document.getElementById("ufix"); if (fix) renderColumns(fix, false);
  }
  // An edit in the upload sheet changes the file's copy in the page (never the file itself), then the CRM checks the rows again.
  async function uploadEdits(changes){
    const rowsHit = new Set(changes.map(ch => ch.row.row));
    const was = {}; rowsHit.forEach(r => { const p = (U.preview||[]).find(x => x.row === r); was[r] = !!(p && uWrong(p)); });
    changes.forEach(ch => { const i = +ch.key.slice(1), row = U.grid[ch.row.row - 1]; while (row.length <= i) row.push(""); row[i] = ch.value ?? "";
      // From a suggestion: marked. Typed (or undone) by a person: not.
      const k = ch.row.row + ":" + i, next = (U.aiNext||{})[k]; U.ai = U.ai || {};
      if (next && String(next.value) === String(ch.value ?? "")) U.ai[k] = { ...next, at: new Date().toISOString().slice(0,10) }; else delete U.ai[k]; });
    U.aiNext = null; U.edited = true; buildRows(); U.busy = true;
    const pg = document.getElementById("uprog"); if (pg) pg.textContent = "Checking again…";
    try { await runCheck(); } finally { U.busy = false; }
    renderSummary(document.getElementById("main"));
    const fixed = [...rowsHit].filter(r => { const p = U.preview.find(x => x.row === r); return was[r] && p && !uWrong(p); });
    toast(rowsHit.size > 1 ? `Changed ${rowsHit.size} rows${fixed.length ? `; ${fixed.length} fixed (green)` : ""}.` : fixed.length ? `Row ${fixed[0]} is fixed. It stays in green so you can check it.` : `Row ${[...rowsHit][0]} saved for the import.`);
  }

  function renderColumns(el, standalone){
    const head = U.headerRow >= 0 ? U.grid[U.headerRow] : (U.grid[0]||[]).map((_,i)=>"Column "+(i+1));
    const body = U.grid.slice(U.headerRow + 1);
    const fileCols = head.map((_,i)=>i).filter(i => head[i] || body.some(r => (r[i]||"") !== ""));
    const sample = i => (body.find(r => clean(r[i])) || [])[i] || "";
    const fieldOf = i => Object.keys(U.map).find(k => U.map[k] === i) || (skipped(i) ? "__skip" : "");
    const fieldOpts = cur => `<option value="__skip" ${cur==="__skip"?"selected":""}>Leave out (not saved)</option><option value="" ${cur===""?"selected":""}>Keep on the lead under Came from</option><optgroup label="Main details">${COLS.map(([k,l])=>`<option value="${k}" ${cur===k?"selected":""}>${esc(l)}</option>`).join("")}</optgroup><optgroup label="More lead fields">${XFIELDS.map(([k,l])=>`<option value="${k}" ${cur===k?"selected":""}>${esc(l)}</option>`).join("")}</optgroup>`;
    el.innerHTML = `${standalone?`<div class="view"><section class="panel"><h3>${esc(U.name)}</h3><p>Which column has the author's name?</p>`:""}
      <div class="field" style="max-width:520px;margin-bottom:12px"><label>List</label><select id="ulist"><option value="">New list: ${esc(U.newList?.name||"")}</option>${U.found.map(f=>`<option value="${f.list}" ${f.list===U.listId?"selected":""}>${esc(f.name)} (${f.matches} names match)</option>`).join("")}${S.lists.filter(l=>!U.found.some(f=>f.list===l.id)).map(l=>`<option value="${l.id}" ${l.id===U.listId?"selected":""}>${esc(l.name)}</option>`).join("")}</select></div>
      ${instr(`Each column in your file, and where it goes. "Keep on the lead under Came from" saves it on the lead's page, in what that row of the file said, without putting it in a field. Columns with no heading are left out unless you keep them.`)}
      <div class="tablewrap"><table><thead><tr><th>Column in the file</th><th>Example</th><th>Goes to</th></tr></thead><tbody>${fileCols.map(i=>`<tr style="cursor:default"><td>${esc(colLabel(i))}</td><td style="max-width:260px;overflow:hidden;text-overflow:ellipsis">${esc(sample(i))}</td><td><select data-i="${i}">${fieldOpts(fieldOf(i))}</select></td></tr>`).join("")}</tbody></table></div>
      <div class="inline" style="margin-top:12px"><button class="btn" id="uapply">Check again</button></div>
      ${standalone?`</section></div>`:""}`;
    el.querySelector("#uapply").onclick = async () => {
      U.listId = el.querySelector("#ulist").value;
      const map = {}, twice = [];
      const skip = [];
      el.querySelectorAll("select[data-i]").forEach(s => { if (s.value === "__skip") { skip.push(+s.dataset.i); return; } if (!s.value) return; if (map[s.value] !== undefined) twice.push(ALLF.find(f => f[0] === s.value)[1]); map[s.value] = +s.dataset.i; });
      if (twice.length) return toast(`Two columns go to ${twice.join(", ")}. Pick one.`);
      U.map = map; U.skip = skip;
      if (U.map.name === undefined) return toast("Pick which column has the author's name.");
      buildRows(); U.busy = true; try { await runCheck(); } catch (e) { toast("Couldn't check the file: " + e.message); } U.busy = false;
      renderSummary(document.getElementById("main"));
    };
  }

  // Which upload column fills which lead field (for recording suggestion-filled values).
  const DBF = { name:"name", amazon:"amazon_author_page", email:"email", website:"website", facebook:"facebook", instagram:"instagram", best_series:"best_series", contact_page:"website_contact_page", phone:"phone" };
  async function recordAi(){
    const marks = Object.entries(U.ai||{}).filter(([, m]) => String(m.value||"").trim()); if (!marks.length) return;
    const byLead = {};
    marks.forEach(([k, m]) => { const [r, c] = k.split(":").map(Number), p = U.preview.find(x => x.row === r); if (!p?.lead) return;
      const key = Object.keys(U.map).find(x => U.map[x] === c), f = key && (DBF[key] || (XFIELDS.some(x => x[0] === key) ? key : null)); if (!f) return;
      (byLead[p.lead] = byLead[p.lead] || []).push({ f, ...m }); });
    const ids = Object.keys(byLead); if (!ids.length) return;
    const { data } = await sb.from("leads").select("*").in("id", ids);
    await inBatches(data || [], 8, async L => {
      const ai = { ...(L.ai_filled || {}) }; let found = false;
      byLead[L.id].forEach(m => { if (String(L[m.f] ?? "").toLowerCase() !== String(m.value).toLowerCase()) return;   // we kept our own value instead
        ai[m.f] = { by: m.by, how: m.how, at: m.at, accepted_by: S.me.id, file: U.name }; if (m.f === "email" && m.by === "CRM website check") found = true; });
      if (JSON.stringify(ai) === JSON.stringify(L.ai_filled || {})) return;
      await sb.from("leads").update({ ai_filled: ai, ...(found ? { email_found_by: "CRM website check" } : {}) }).eq("id", L.id);
    });
  }
  async function doImport(){
    const btn = document.getElementById("uimport"); btn.disabled = true;
    try {
      if (!U.listId) {
        const L = U.newList;
        const { data, error } = await sb.from("lists").insert({ name: L.name, source: L.source, genre: L.genre || null, raw_count: U.rows.length, status: U.kind === "contacts" ? "Vetting" : "Pulled" }).select("id,name").single();
        if (error) throw error; U.listId = data.id; S.lists.unshift(data);
      }
      U.preview = await runImport(U.listId, true); U.done = true;
      await recordAi();
      if (U.batch) await sb.from("intake_batches").update({ status:"Brought in", list:U.listId, done_by:S.me.id, done_at:new Date().toISOString() }).eq("id", U.batch);
      renderSummary(document.getElementById("main")); toast("Imported.");
    } catch (e) { console.error(e); btn.disabled = false; toast("Import stopped: " + e.message + ". Rows before the error were saved; importing again is safe."); }
  }

  // ---------- Live updates ----------
  let channel;
  function watch(){
    channel?.unsubscribe();
    channel = sb.channel("crm").on("postgres_changes", { event:"*", schema:"public", table:"leads" }, payload => {
      const row = payload.new || {};
      // All leads is open: other people's changes show up in the sheet straight away.
      if (S.sheet && S.leadsData && location.hash.startsWith("#leads") && S.sheet.el.isConnected) {
        if (payload.eventType === "DELETE") S.leadsData = S.leadsData.filter(L => L.id !== payload.old?.id);
        else { const L = S.leadsData.find(L => L.id === row.id); if (L) { if ((row.version ?? 0) >= (L.version ?? 0)) Object.assign(L, row); } else S.leadsData.push({ ...row, _lists: [] }); }
        S.sheet.setRows(S.leadsData);
      }
      if (S.lead && row.id === S.lead.id && row.version !== S.lead.version) {
        if (S.editing) {
          const who = S.team[row.updated_by] || "Someone";
          if (row.updated_by !== S.me.id) document.getElementById("stale").innerHTML = `<div class="banner">${esc(who)} just changed this lead. If you save now, your save will be refused so neither of you loses work. <button class="btn sm" id="reload2">Load their version</button></div>`;
          document.getElementById("reload2")?.addEventListener("click", () => leadView(S.lead.id));
        } else if (location.hash.startsWith("#lead/")) leadView(S.lead.id);
      }
    }).subscribe();
  }

  // ---------- Start ----------
  async function loadMe(){
    const { data, error } = await sb.rpc("whoami");
    S.me = !error && data && data[0] ? data[0] : null;
    S.meError = error ? error.message : null;   // a failed check isn't "not on the team list"
    if (S.me) await loadFeatures();
  }
  async function loadFeatures(){
    try { const r = await sb.from("features").select("*").order("sort"); S.features = r.error ? [] : (r.data || []); }
    catch { S.features = []; }
    try { const r = await sb.from("rules").select("*").order("sort"); S.rules = r.error ? [] : (r.data || []); }
    catch { S.rules = []; }
    try { const r = await sb.from("ai_confidence").select("task,scored,pct"); S.conf = r.error ? [] : (r.data || []); }
    catch { S.conf = []; }
  }
  // v6.86 (step 9): a Team rules number, or the app's own default if the list can't be loaded
  const ruleNum = (key, fallback) => { const r = (S.rules || []).find(x => x.key === key); return r && r.value_number != null ? Number(r.value_number) : fallback; };
  // Supabase asks that the auth callback not wait on other calls, so the
  // real work runs just after it.
  sb.auth.onAuthStateChange((event, session) => {
    const changed = (session?.user?.id) !== (S.session?.user?.id);
    S.session = session;
    if (!changed && event !== "INITIAL_SESSION") return;
    setTimeout(async () => {
      if (session) { await loadMe(); if (S.me) watch(); } else { S.me = null; channel?.unsubscribe(); }
      if (/access_token|error_description/.test(location.hash)) history.replaceState(null, "", location.pathname);
      route();
    }, 0);
  });
  document.getElementById("globalFile").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) startUpload(f); });
  let dragDepth = 0; const shade = document.getElementById("dropShade");
  const hasFile = e => [...(e.dataTransfer?.types||[])].includes("Files");
  window.addEventListener("dragenter", e => { if (!hasFile(e) || !S.me || !canEdit()) return; e.preventDefault(); dragDepth++; shade.hidden = false; });
  window.addEventListener("dragover", e => { if (hasFile(e)) e.preventDefault(); });
  window.addEventListener("dragleave", e => { if (!hasFile(e)) return; dragDepth = Math.max(0, dragDepth-1); if (!dragDepth) shade.hidden = true; });
  window.addEventListener("drop", e => { if (!hasFile(e)) return; e.preventDefault(); dragDepth = 0; shade.hidden = true; const f = e.dataTransfer.files[0]; if (f && S.me && canEdit()) startUpload(f); });
  window.addEventListener("hashchange", () => { if (!/access_token/.test(location.hash)) route(); });
  window.addEventListener("beforeunload", e => { if (S.editing) { e.preventDefault(); e.returnValue = ""; } });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BPF Lead Hub CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="sheet.css?v=6.97">
<script src="sheet.js?v=6.97"></script>
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#16202C; --muted:#5A6676; --line:#D5DBE2; --zebra:#F6F8FA;
  --accent:#2F55D4; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB;
  --ok:#1E7F55; --ok-soft:#DDF1E7; --warn:#9A6A00; --warn-soft:#F8EDCF; --ai-line:#E0A800; --bad:#B23A32; --bad-soft:#F7E0DD;
  --display:"Young Serif", Georgia, serif;
  --body:"Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Atkinson Hyperlegible Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151C; --panel:#18202A; --ink:#E6EBF1; --muted:#99A5B4; --line:#2A3441; --zebra:#1C2530;
  --accent:#7D98F5; --accent-ink:#0E1420; --accent-soft:#222E4D;
  --ok:#5CCB98; --ok-soft:#173326; --warn:#E5C15C; --warn-soft:#352B12; --ai-line:#E5C15C; --bad:#EE8A80; --bad-soft:#3A1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151C; --panel:#18202A; --ink:#E6EBF1; --muted:#99A5B4; --line:#2A3441; --zebra:#1C2530;
  --accent:#7D98F5; --accent-ink:#0E1420; --accent-soft:#222E4D;
  --ok:#5CCB98; --ok-soft:#173326; --warn:#E5C15C; --warn-soft:#352B12; --ai-line:#E5C15C; --bad:#EE8A80; --bad-soft:#3A1F1C; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{margin:0 auto}   /* full width: tables grow with the window */
@media (min-width:900px){.gut{padding-left:28px;padding-right:28px}}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:15px}
.bar{position:sticky;top:0;z-index:60;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:24px}
.tag{font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:5px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.who{font-size:14.5px;color:var(--muted)}
.tabs{display:flex;gap:2px;flex-basis:100%;flex-wrap:wrap;align-items:center}
.more{position:relative;display:inline-block}
.more-menu{display:none;position:absolute;right:0;left:auto;top:100%;z-index:40;min-width:180px;padding:6px;background:var(--panel,var(--bg));border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.more:hover .more-menu,.more:focus-within .more-menu{display:block}
.more-menu a{display:block}
details.instr{margin:6px 0 0;font-size:14.5px}
details.instr summary{cursor:pointer;color:var(--muted);font-weight:600;width:max-content}
details.instr summary:hover{color:var(--ink)}
details.instr>div{margin-top:6px;padding:10px 12px;background:var(--zebra);border-radius:8px;line-height:1.55}
.tabs a{text-decoration:none;color:var(--muted);font-weight:600;padding:7px 12px;border-radius:8px;white-space:nowrap}
.tabs a:hover{color:var(--ink);background:var(--zebra)}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:14.5px}
.btn[disabled]{opacity:.5;cursor:default}
main{padding-block:18px 64px}
.view{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.panel h3{font-size:19px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column}
.card b{font:500 30px/1.1 var(--mono)}
.card span{color:var(--muted)}
.card.hot b{color:var(--accent)}
.card.bad b{color:var(--bad)}
button.card{font:inherit;text-align:left;cursor:pointer}
button.card:hover{border-color:var(--accent)}
button.card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input,.filters select,.field input,.field select,.field textarea{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);max-width:100%}
.filters input[type=search]{flex:1 1 220px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13.5px;text-transform:uppercase;letter-spacing:.04em}
tbody tr:nth-child(even){background:var(--zebra)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
.pill{font:500 13px/1 var(--mono);padding:4px 7px;border-radius:6px;display:inline-block}
.g-Clear{background:var(--ok-soft);color:var(--ok)}
.g-Check{background:var(--warn-soft);color:var(--warn)}
.g-Paused{background:var(--accent-soft);color:var(--accent)}
.g-Blocked{background:var(--bad-soft);color:var(--bad)}
.record{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.record{grid-template-columns:1fr}}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%}
.hit{border-left:3px solid var(--line);padding:4px 10px;margin-bottom:8px}
.hit.Blocked{border-color:var(--bad)} .hit.Check{border-color:var(--warn)} .hit.Paused{border-color:var(--accent)}
.note{border-bottom:1px solid var(--line);padding:8px 0}
.note small,.hist small{color:var(--muted)}
.hist{font-size:14.5px;border-bottom:1px solid var(--line);padding:6px 0}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;max-width:calc(100% - 32px)}
.login{max-width:420px;margin:12vh auto 0}
.login .panel{display:flex;flex-direction:column;gap:12px}
.login input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
[hidden]{display:none!important}
table.filedata td{max-width:320px;overflow:hidden;text-overflow:ellipsis}
.ed{display:inline-block;min-width:70px;min-height:1.3em;padding:2px 4px;border-radius:4px;outline:none;cursor:text;vertical-align:middle}
.ed:hover{background:var(--line)}
.ed:focus{background:var(--panel);box-shadow:0 0 0 2px var(--accent);white-space:normal;max-width:none}
td a.go{margin-left:4px;text-decoration:none}
td.badcell{box-shadow:inset 0 0 0 2px var(--bad)}
.fixes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fixes .btn{white-space:normal;text-align:left}
.topscroll{overflow-x:auto;overflow-y:hidden;height:16px;margin-bottom:4px}.topscroll>div{height:1px}
/* The upload sheet works like a spreadsheet: it fills the window, scrolls both ways inside its box,
   keeps the header row and the Row and Author columns in view, has gridlines, and columns can be resized. */
#ubottom{max-height:calc(100vh - 90px);overflow:auto;position:relative}
table.filedata{width:max-content;min-width:100%}
table.filedata th,table.filedata td{border-right:1px solid var(--line)}
table.filedata thead th{position:sticky;top:0;z-index:2;background:var(--panel);box-shadow:inset 0 -1px 0 var(--line)}
table.filedata tr>:nth-child(1),table.filedata tr>:nth-child(2){position:sticky;background:var(--panel);z-index:1}
table.filedata tr>:nth-child(1){left:0;min-width:64px}
table.filedata tr>:nth-child(2){left:64px;box-shadow:inset -2px 0 0 var(--line)}
table.filedata thead tr>:nth-child(1),table.filedata thead tr>:nth-child(2){z-index:3}
table.filedata th{position:relative}
.rz{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;z-index:4}
.rz:hover,.rz.on{background:var(--accent);opacity:.5}
/* Green: a row that was flagged and is now clear stays in "to look at" so it can be checked; a cell you changed is outlined green. */
table.filedata tr.okrow>td{background:var(--ok-soft)}
table.filedata td.okcell{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok)}
.wasnote{color:var(--ok);font-weight:600}
table.filedata td.look{white-space:normal;min-width:260px;max-width:340px}
.drop{border:2px dashed var(--line);display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;cursor:pointer;font:inherit;color:var(--ink);width:100%}
.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
#dropShade{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--accent) 18%,transparent);display:flex;align-items:center;justify-content:center;pointer-events:none}
#dropShade div{background:var(--panel);border:2px dashed var(--accent);border-radius:14px;padding:22px 30px;font-weight:700;font-size:20px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px}
/* Sales side: Pipeline board, deal cards, the lead's activity timeline */
.tabs .sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.brail{overflow-x:auto;overflow-y:hidden;height:16px;scrollbar-width:auto}.brail>div{height:1px}.brail.bot{position:sticky;bottom:0;background:var(--bg);z-index:2}.brail[hidden]{display:none}.brail::-webkit-scrollbar{height:12px;-webkit-appearance:none}.brail::-webkit-scrollbar-track{background:var(--zebra);border-radius:6px}.brail::-webkit-scrollbar-thumb{background:var(--muted);border-radius:6px;border:2px solid var(--zebra)}.brail::-webkit-scrollbar-thumb:hover{background:var(--ink)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start;scrollbar-width:none}.board::-webkit-scrollbar{display:none}
.bcol{background:var(--zebra);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
.bcol.over{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bcol header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin-bottom:8px;line-height:1.3}
.bcol header small{flex-basis:100%}
.bcards{display:flex;flex-direction:column;gap:8px}
.dcard{display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink);cursor:grab}
.dcard:hover{border-color:var(--accent)}
.dcard small{color:var(--muted);font-size:13.5px;line-height:1.45}
.dcard{position:relative}
.dcard .fuc{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 16px 16px 0;border-color:transparent var(--fuc) transparent transparent;border-top-right-radius:10px}
.fuc.red,.fuc-key.red{--fuc:var(--bad)} .fuc.yellow,.fuc-key.yellow{--fuc:var(--ai-line)} .fuc.green,.fuc-key.green{--fuc:var(--ok)}
.fuc-key{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--fuc);vertical-align:-1px}
/* v6.72 Claude's stage on a board card (aiView: H+AI outlined yellow, AI plain, Human not drawn) */
.dcard.dcai.ai{border:2px solid var(--ai-line)}
.dcard .dai{display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--line);padding-top:5px;font-size:13px;cursor:default}
.dcard .dai-l{font:700 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:4px}
.dcard .dai-q{color:var(--muted);font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard .dai-b{display:flex;gap:6px;margin-top:2px}
.dcard .stuck{color:color-mix(in srgb,var(--bad) 75%,var(--muted));font-size:13px}
.bcol header .tot{margin-left:auto;text-align:right;font-size:13px;line-height:1.35}
.pill.tier{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg a{padding:5px 11px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px}
.seg a[aria-current]{background:var(--accent-soft);color:var(--accent)}
.lhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.lhead .facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;color:var(--muted)}
.composer .kinds{display:flex;flex-wrap:wrap;gap:4px}
.composer .kinds button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.composer .kinds button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.composer textarea,.composer input,.composer select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl .ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--zebra);font-size:14px}
.tl .ic.in{background:var(--ok-soft)} .tl .ic.out{background:var(--accent-soft)} .tl .ic.stage{background:var(--warn-soft)}
.tl .body{white-space:pre-wrap;word-break:break-word;margin-top:3px}
.tl small{color:var(--muted)}
.task{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.task.done span{text-decoration:line-through;color:var(--muted)}
.task small.late{color:var(--bad);font-weight:700}
.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card.kpi{gap:4px}
.card.kpi b{font:600 30px/1.1 var(--body)}
.card.kpi small{font-size:13px;line-height:1.35}
.meter{display:block;height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden;margin:4px 0 2px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
table.kpit td.num,table.kpit th.num{text-align:right;font-variant-numeric:tabular-nums}
table.kpit td.num span{font-size:13px;margin-left:4px}
/* Emails inbox (v6.17) */
.em{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;min-height:0}
.em.has-pane{grid-template-columns:150px minmax(0,1fr) minmax(0,440px)}
@media (max-width:1100px){.em.has-pane{grid-template-columns:128px minmax(0,1fr) minmax(0,400px)}}
@media (max-width:760px){.em,.em.has-pane{grid-template-columns:minmax(0,1fr);height:auto!important}.em-folders{flex-direction:row!important;flex-wrap:wrap}}
.em-folders{display:flex;flex-direction:column;gap:2px;min-width:0}
.em-folders button{display:flex;justify-content:space-between;gap:8px;border:0;background:none;padding:7px 10px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;text-align:left}
.em-folders button:hover{background:var(--zebra);color:var(--ink)}
.em-folders button[aria-current]{background:var(--accent-soft);color:var(--accent)}
.em-list,.em-pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;min-height:0;min-width:0}
.em-item{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;cursor:pointer;font:inherit;color:inherit}
.em-item:hover{background:var(--zebra)}
.em-item[aria-current]{background:var(--accent-soft)}
.em-item .r1{display:flex;gap:8px;justify-content:space-between;min-width:0}
.em-item .r1 b,.em-item .sub,.em-item .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.em-item .r1 span{flex:0 0 auto;font-size:13.5px}
.em-item .sub,.em-item .meta{font-size:14px}
.em-pane{padding:14px 16px;display:flex;flex-direction:column;gap:8px;outline:none}
.em-kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;font-size:14.5px;overflow-wrap:anywhere}
.em-eform input,.em-eform textarea{display:block;width:100%;padding:7px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);font:inherit}
.em-eform input{font-weight:600;font-size:16px}.em-eform textarea{font-size:15px;line-height:1.5;resize:vertical;min-height:320px}
.em-eform input:hover,.em-eform textarea:hover{border-color:var(--line)}.em-eform input:focus,.em-eform textarea:focus{border-color:var(--accent);background:var(--bg);outline:none}
.em-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
/* v6.30 Calendly: booking cards, the right-hand drawer, the calendar (v6.31) and Today's calls (v6.32) */
.cal-card{border:1px solid var(--line);border-left:4px solid var(--host,var(--line));border-radius:10px;padding:8px 10px;background:var(--panel);display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.cal-card .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cal-card.off{opacity:.75}.cal-card.off .when{text-decoration:line-through}
.cal-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--host,var(--muted));vertical-align:baseline;flex:0 0 10px}
.cal-qa{margin:2px 0 0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.cal-qa div{border-top:1px dashed var(--line);padding-top:4px}.cal-qa b{display:block;font-weight:600;font-size:13px;color:var(--muted)}
.cal-qa span{white-space:pre-wrap;overflow-wrap:anywhere}
/* v6.39 Upcoming consults: flag dot (yellow ring = Claude's suggestion, not checked yet), reason in red, prep due, routing advice */
.cflag-dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:var(--f);vertical-align:middle;flex:0 0 13px}
.cflag-dot.ai{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ai-line)}
.cflag-dot.none{background:transparent;border:2px dashed var(--muted);width:13px;height:13px;box-sizing:border-box}
.cflag-btn{border:0;background:none;padding:2px;cursor:pointer;line-height:0}
.cflag-lbl{font-size:12.5px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}.cflag-lbl.ai{border:2px solid var(--ai-line)}
.cons-ai{border-left:3px solid var(--ai-line);padding:3px 8px;font-size:14px}
/* v6.63 Claude's suggestions (one rule, aiView()): H+AI = yellow outline (.ai), AI = plain, Human = not drawn */
.cchip.aisg{color:var(--ink);font-weight:600}.cchip.aisg.ai{border:1.5px solid var(--ai-line);background:var(--warn-soft)}
.aisug{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;display:flex;flex-direction:column;gap:5px}
.aisug.ai{border:2px solid var(--ai-line)}

  const TRACKING = /^(utm_.*|fbclid|gclid|gbraid|wbraid|dclid|msclkid|igshid|igsh|mibextid|si|ref|ref_|ref_src|_encoding|pd_rd_.*|pf_rd_.*|content-id|qid|sr|crid|sprefix|dib|dib_tag|psc|th|linkcode|tag|camp|creative|creativeasin|mc_cid|mc_eid|_hsenc|_hsmi|hsctatracking|mkt_tok|vero_.*|ck_subscriber_id|s_kwcid|epik|share_id|shoppingportalenabled|rdt)$/i;
  const allBooks = u => { const m = u.match(/^https?:\/\/(?:www\.)?amazon\.com\/(?:stores\/(?:[^/]+\/)?author|e)\/(B0[0-9A-Z]{8})(?:[/?#]|$)/i);
    if (m) return `https://www.amazon.com/stores/author/${m[1]}/allbooks`;
    const d = u.match(/^https?:\/\/(?:www\.)?amazon\.com\/(?:[^?#]*?\/)?(?:dp|gp\/product)\/([A-Z0-9]{10})(?:[/?#]|$)/i);
    if (d) return `https://www.amazon.com/dp/${d[1].toUpperCase()}`;
    // Any other link: tracking codes off by default (Kyle, Thu 12 Nov: "strip out all tracking codes by default").
    if (/amazon\./i.test(u) && /\/s\?/.test(u)) return u;   // an Amazon search link stays as it is
    try { const x = new URL(u);
      [...x.searchParams.keys()].forEach(k => { if (TRACKING.test(k)) x.searchParams.delete(k); });
      x.pathname = x.pathname.replace(/\/ref=[^/]*$/, ""); return x.toString(); } catch { return u; } };

  // ---------- Merge two leads that are the same person (v6.11, migration 0055) ----------

    }, 250); };

    async function counts(id){

  // Notes (v6.25): a type, a pin and @mentions. A mention is "@Name" in the text (shown as the name) plus a note_mentions row.
  const NOTE_KINDS = ["General", "Call", "Vetting", "Personal"];
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const teamByLen = () => Object.entries(S.team).filter(([, n]) => n).sort((a, b) => b[1].length - a[1].length);
  const mentionedIds = text => teamByLen().filter(([, n]) => new RegExp("@" + reEsc(n) + "(?![\\w])", "i").test(text || "")).map(([id]) => id);
  const mentionHtml = text => { let h = esc(text || "");
    teamByLen().forEach(([, n]) => { h = h.replace(new RegExp("@" + reEsc(esc(n)) + "(?![\\w])", "gi"), `<b style="color:var(--accent)">@${esc(n)}</b>`); });
    return h; };
  function bindQuickNote(f, L, deal, reload){
    if (!f) return;
    const ta = f.text, list = f.querySelector("[data-mlist]");
    let kind = "General", picks = [], at = 0;
    f.querySelectorAll("[data-nk]").forEach(a => a.onclick = e => { e.preventDefault(); kind = a.dataset.nk; f.querySelectorAll("[data-nk]").forEach(x => x === a ? x.setAttribute("aria-current", "true") : x.removeAttribute("aria-current")); ta.focus(); });
    const close = () => { list.hidden = true; picks = []; };
    const pick = name => { const pos = ta.selectionStart, before = ta.value.slice(0, pos).replace(/@([^\s@]*)$/, "@" + name + " ");
      ta.value = before + ta.value.slice(pos); ta.selectionStart = ta.selectionEnd = before.length; close(); ta.focus(); };
    const draw = () => { list.innerHTML = picks.map((n, i) => `<button type="button" class="btn sm" data-mp="${i}" style="display:block;width:100%;text-align:left;border:0;${i === at ? "background:var(--accent-soft)" : ""}">${esc(n)}</button>`).join("");
      list.querySelectorAll("[data-mp]").forEach(b => b.onmousedown = e => { e.preventDefault(); pick(picks[+b.dataset.mp]); }); };
    ta.oninput = () => { const m = ta.value.slice(0, ta.selectionStart).match(/(?:^|\s)@([^\s@]*)$/);
      if (!m) return close();
      picks = Object.values(S.team).filter(n => n && n.toLowerCase().startsWith(m[1].toLowerCase())).sort().slice(0, 6); at = 0;
      if (!picks.length) return close(); list.hidden = false; draw(); };
    ta.onblur = () => setTimeout(close, 150);
    ta.onkeydown = e => {
      if (!list.hidden && picks.length) {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); at = (at + (e.key === "ArrowDown" ? 1 : picks.length - 1)) % picks.length; return draw(); }
        if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); return pick(picks[at]); }
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); return close(); } }
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); f.requestSubmit(); } };
    f.onsubmit = async e => { e.preventDefault();
      const text = ta.value.trim(); if (!text) return ta.focus();
      const btn = f.querySelector("[type=submit]"); btn.disabled = true; ta.disabled = true;
      const pin = f.pin.checked, now = new Date().toISOString();
      const { data, error } = await sb.from("notes").insert({ lead: L.id, opportunity: deal && ["In progress", "Stalled"].includes(deal.status) ? deal.id : null, text, author: S.me.id, kind,
        pinned: pin, pinned_at: pin ? now : null, pinned_by: pin ? S.me.id : null }).select("id").single();
      if (error) { btn.disabled = false; ta.disabled = false; return toast("Couldn't add the note: " + error.message); }
      const ids = mentionedIds(text);
      if (ids.length) { const { error: me } = await sb.from("note_mentions").insert(ids.map(member => ({ note: data.id, member })));
        if (me) toast("Note added, but the mentions weren't saved: " + me.message); else toast("Note added"); } else toast("Note added");
      reload(); };
  }
  // Start a deal by hand (one open deal per author).
  async function startDealFor(L, stage){
    const { data, error } = await sb.from("opportunities").insert({ lead: L.id, name: L.name + " · " + (L.tier || "opportunity"), stage: stage || "Outreach begun",
      program: TIERS.includes(L.tier) ? L.tier : null, owner: L.owner || S.me.id, source: SOURCES.includes(L.source) ? L.source : null }).select("*").single();
    if (error) { toast("Couldn't start the opportunity: " + error.message); return null; }
    return data;

  // Log what happened (v6.0; v6.24 shared by the pane and the page). Notes go to notes, messages a person sent to touches (status
  // Sent; the CRM never sends anything), replies to replies, consults to calls.
  function bindComposer(logf, L, d, reload, first){
    if (!logf) return;
    const deal = recDeal(d), touches = d.touches || [];
    let kind = first || "note";
    const showKind = () => { logf.querySelectorAll("[data-for]").forEach(x => x.hidden = x.dataset.for !== kind);
      logf.text.placeholder = kind === "note" ? "Write a note" : kind === "reply" ? "Paste or sum up their reply" : kind === "call" ? "Anything to know before the consult (optional)" : "What you sent (paste it if you like)"; };
    showKind();
    logf.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { kind = b.dataset.kind; logf.querySelectorAll("[data-kind]").forEach(x => x.setAttribute("aria-pressed", x === b)); showKind(); logf.text.focus(); });
    logf.onsubmit = async e => { e.preventDefault();
      const text = logf.text.value.trim(), when = logf.when.value ? new Date(logf.when.value).toISOString() : new Date().toISOString();
      if (kind !== "call" && !text) return logf.text.focus();
      if (kind === "call" && !logf.cat.value) return toast("Pick when the consult is.");
      const btn = logf.querySelector("button[type=submit]"); btn.disabled = true;
      try {
        let dl = deal && (deal.status === "In progress" || deal.status === "Stalled") ? deal : null;
        if (!dl && kind !== "note") { dl = await startDealFor(L); if (!dl) return; }
        let err;
        if (kind === "note") ({ error: err } = await sb.from("notes").insert({ lead: L.id, opportunity: dl?.id || null, text, author: S.me.id }));
        else if (kind === "reply") ({ error: err } = await sb.from("replies").insert({ lead: L.id, received_at: when, channel: logf.rchannel.value, category: logf.rcat.value, summary: text.slice(0, 200), text }));
        else if (kind === "call") {
          ({ error: err } = await sb.from("calls").insert({ lead: L.id, opportunity: dl.id, call_type: logf.ctype.value, booked_at: when, starts_at: new Date(logf.cat.value).toISOString(), host: S.me.id, status: "Scheduled" }));
          // v6.70: the database moves the opportunity to Consult booked (migration 0101, forward only).
          if (!err && text) await sb.from("notes").insert({ lead: L.id, opportunity: dl.id, text, author: S.me.id });
        } else {
          const channel = { email: "Email", dm: "Instagram DM", fb: "Facebook", form: "Contact form", phone: "Phone" }[kind];

  async function saveLead(form){
    const L = S.lead, fd = new FormData(form), patch = {};
    for (const [k,,type] of FIELDS) {
      let v = (fd.get(k) ?? "").toString().trim();
      if (v === "" && form.elements[k]?.dataset?.aihid) continue;   // v6.23: hidden AI value left blank in the Human view = unchanged
      v = v === "" ? null : type === "number" ? parseInt(v,10) : v;
      if ((L[k] ?? null) !== v) patch[k] = v;
    }
    for (const k of ["pen_names","genres"]) {
      const v = (fd.get(k)||"").toString().split("\n").map(s=>s.trim()).filter(Boolean);
      if (JSON.stringify(v) !== JSON.stringify(L[k]||[])) patch[k] = v;
    }
    if (!Object.keys(patch).length) { toast("Nothing changed"); return; }
    // v6.72: no ai_filled here; the database drops the AI mark of a field a person changes (migration 0102).
    const btn = document.getElementById("save"); btn.disabled = true;
    // Only save if nobody else changed the lead since it was opened.
    const { data, error } = await sb.from("leads").update(patch).eq("id", L.id).eq("version", L.version).select("id,version,gate");
    if (error) {
      btn.disabled = false;
      if (error.code === "23505") return toast("Another lead already has that email or pen name. Nothing was saved.");
      if (/Gatekeeper/.test(error.message)) return toast(error.message);
      return toast("Couldn't save: " + error.message);
    }
    if (!data || !data.length) {
      btn.disabled = false;
      document.getElementById("stale").innerHTML = `<div class="banner">Someone else changed this lead while you were editing, so your changes weren't saved. <button class="btn sm" id="reload">Load their version</button> Then make your change again.</div>`;
      document.getElementById("reload").onclick = () => leadView(L.id);
      return;
    }
    S.editing = false;
    toast(data[0].gate !== L.gate ? `Saved. The Gatekeeper now says ${data[0].gate}.` : "Saved");
    leadView(L.id);
  }

  // Kyle (Thu 12 Nov): an Amazon search link in place of the author page is red.
  const isAmazonSearch = v => /amazon\.[a-z.]+\/s(\?|\/)/i.test(String(v || ""));
  // Red: what a person has to deal with.
  const rNeeds = (r, col) => {
    if (col.key === "name" && r.research_status === "Not a fit (trad)") return "Claude thinks this author is traditionally published. Check, then Disqualify (Traditional) or Approve.";
    if (col.key === "name" && r.research_status === "Can't tell who this is") return "Claude couldn't tell who this is. Check them, or Disqualify (Not an author).";

    if ((col.key === "research_status" || col.key === "_needs") && r.research_status === "Can't tell who this is") return "Claude couldn't tell who this is. Check them on Amazon, or set Decision to Leave out.";
    if (col.key === "program_confirmed" && r.research_status === "Rank needed" && !r.program_confirmed) return "Waiting on the Amazon screenshot. Claude's provisional pick from the catalog: " + ((r.f || {}).tier_suggested || "none") + ". " + ((r.f || {}).tier_reason || "");
    if ((col.key === "research_status" || col.key === "_needs") && r.research_status === "Rank needed") return "The program depends on their Amazon rank, which Claude doesn't check. Type the ranks you saw (select the row, then Add ranks), then pick the Program.";

    if (col.key === "name" && /Gatekeeper: (Blocked|Paused|Check)|^Check:/.test(S.rCheck?.[r.batch + ":" + r.row_number] || "")) return S.rCheck[r.batch + ":" + r.row_number] + ". Look before approving: the Gatekeeper won't let a Blocked author into outreach.";
    if (col.key === "f.amazon_author_page" && isAmazonSearch((r.f || {}).amazon_author_page)) return "Claude couldn't find their Amazon author page, so this is only a search. Find the author page and paste it in.";
    if (col.key === "f.email" && badMailTip((r.f || {}).email)) return badMailTip((r.f || {}).email);

    const evText = e => `${word[e.kind]}${e.tracked_links ? ` "${e.tracked_links.label}" (${e.tracked_links.kind})` : ""} ${fmtTime(e.occurred_at)}${e.likely_machine ? ` [machine: ${e.machine_reason || "?"}]` : ""}${e.before_send ? " [before it was sent]" : ""}`;
    const list = shown.slice(0, 1000).map(r => ({ ...r, _list: listName[r.list] || "", _events: (byT[r.touch] || []).map(evText).join("\n"),
      _opened: r.open_pixel === false ? "n/a (no image)" : r.human_opens ? `Yes (${r.human_opens})` : "No", _clicked: r.clicks ? `Yes (${r.clicks})` : "No",

        { key: "_booked", label: "Booked" }, { key: "_events", label: "Events", type: "long", width: 340 }, { key: "template_code", label: "Template" },
        { key: "program", label: "Program" }, { key: "sender", label: "Sender" }, { key: "_list", label: "List" }, { key: "touch_number", label: "Touch #", type: "number" },
        { key: "ab_variant", label: "A/B" }, { key: "machine_opens", label: "Machine opens", type: "number" },

  // ---------- Reports (v6.33–, Kyle Thu 19 Nov 2026: "build a reporting section with the functionality like other CRM's have for starters") ----------
  // Spec: claude/leads-team-pm/reports-spec.md. #reports is the dashboard; each full report lives at #reports/<key>.
  // One global bar (date range, program, owner, list or source, campaign) drives every report. Its state is remembered per browser
  // and kept in the link, so a copied link opens the same report with the same filters. Merged leads are always left out.
  // Dates are Eastern; weeks start Monday. The page counts from one row per record (views lead_funnel_facts, lead_status_days,
  // deal_stage_days, migration 0075) with the fetchAll pattern; volumes are tiny (an RPC only if leads pass ~20k).
  // To add a report (a future 9 "Sources", say): add one entry to REPORTS below (key, title, question, instr, run). The dashboard,
  // the Report picker and the #reports/<key> route all read that list, so nothing else needs to change.
  const dMonth = d => d.slice(0, 7) + "-01";
  const dMonthEnd = d => dAdd(dAdd(dMonth(d), 32).slice(0, 7) + "-01", -1);
  const dDays = (a, b) => Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 864e5);
  const dayOf = v => !v ? null : /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : etDate(v);
  const REP_RANGES = [["this_week", "This week"], ["last_week", "Last week"], ["this_month", "This month"], ["last_month", "Last month"], ["last30", "Last 30 days"],
    ["last90", "Last 90 days"], ["this_quarter", "This quarter"], ["all", "All time"], ["custom", "Custom"]];
  function repRange(F){
    const t = etToday(); let a = null, b = null;
    switch (F.range) {
      case "this_week": a = dMon(t); b = dAdd(a, 6); break;
      case "last_week": a = dAdd(dMon(t), -7); b = dAdd(a, 6); break;
      case "this_month": a = dMonth(t); b = dMonthEnd(t); break;
      case "last_month": b = dAdd(dMonth(t), -1); a = dMonth(b); break;
      case "last90": a = dAdd(t, -89); b = t; break;
      case "this_quarter": { const m = Math.floor((+t.slice(5, 7) - 1) / 3) * 3 + 1, s = t.slice(0, 4) + "-" + String(m).padStart(2, "0") + "-01"; a = s; b = dMonthEnd(dAdd(s, 62)); break; }
      case "all": break;
      case "custom": a = F.from || null; b = F.to || null; break;
      default: a = dAdd(t, -29); b = t; }
    return { from: a, to: b };
  }
  const rangeText = R => !R.from && !R.to ? "All time" : `${R.from ? fmtDate(R.from) : "the start"} – ${R.to ? fmtDate(R.to) : "today"}`;
  // Same rounding as Outreach results: under 10% shows one decimal.
  const pctOf = (a, b) => b ? (a / b * 100 >= 10 || a === b ? Math.round(a / b * 100) : (a / b * 100).toFixed(1)) + "%" : "–";
  const money0 = n => "$" + Math.round(Number(n) || 0).toLocaleString();

  // ----- Filter state: per browser (localStorage) and in the link (#reports/<key>?range=…&program=…) -----
  const REP_KEYS = ["range", "from", "to", "program", "owner", "list", "source", "campaign", "group", "compare"];
  function repState(key){
    const p = new URLSearchParams(S.route.split("?")[1] || "");
    let saved = null; try { saved = JSON.parse(localStorage.getItem("bpf-reports") || "null"); } catch {}
    const F = { range: "last30", groups: {}, ...(saved || {}) };
    F.groups = { ...(saved?.groups || {}) };
    if (REP_KEYS.some(k => p.has(k))) {   // a shared link wins over what this browser remembered
      REP_KEYS.filter(k => k !== "group").forEach(k => { F[k] = p.get(k) || ""; });
      if (!F.range) F.range = "last30";
      if (p.get("group") && key) F.groups[key] = p.get("group"); }
    return F;
  }
  function repSave(F, key){
    try { localStorage.setItem("bpf-reports", JSON.stringify(F)); } catch {}
    history.replaceState(null, "", "#" + (S.route = "reports" + (key ? "/" + key : "") + repQs(F, key)));
  }
  const repQs = (F, key) => { const qs = new URLSearchParams(); REP_KEYS.filter(k => k !== "group").forEach(k => { if (F[k] && !(k === "range" && F[k] === "last30")) qs.set(k, F[k]); });
    if (F.range !== "custom") { qs.delete("from"); qs.delete("to"); }
    if (key && F.groups?.[key]) qs.set("group", F.groups[key]); return String(qs) ? "?" + qs : ""; };

  // ----- Data: one load per visit (kept 60 seconds), then every filter change is counted in the page -----
  async function repLoad(force){
    if (!force && S.repData && Date.now() - S.repData.at < 60000) return S.repData;
    await teamNames();
    const [d, fails] = await settle({
      facts: q("lead facts", fetchAll(() => sb.from("lead_funnel_facts").select("*"))),
      emails: q("sent emails", fetchAll(() => sb.from("touch_kpis").select("touch,lead,author,campaign,campaign_name,program,sent_by,sender,list,sent_at,status,replied_at,booked_at"))),
      replies: q("replies", fetchAll(() => sb.from("replies").select("id,lead,received_at,created_at,handled_by,answered_at"))),
      calls: q("consults", fetchAll(() => sb.from("calls").select("id,lead,booked_at,created_at,starts_at,status,result,closed,host,source,calendly_event"))),
      takers: q("who takes each consult", fetchAll(() => sb.from("consult_bookings").select("call,taker").not("call", "is", null).not("taker", "is", null))),   // v6.61
      needOut: q("consults needing an outcome", fetchAll(() => sb.from("consults_needing_outcome").select("call,lead,starts_at,host"))),
      opps: q("opportunities", fetchAll(() => sb.from("opportunities").select("id,lead,name,stage,status,program,owner,potential_value,close_date,lost_reason,created_at"))),
      sales: q("sales", fetchAll(() => sb.from("sales").select("id,opportunity,amount"))),
      lists: q("lists", sb.from("lists").select("id,name,source,genre,created_at").order("name")).then(must),
      team: q("team", sb.from("team").select("id,name,active").order("name")).then(must),
      campaigns: q("campaigns", campaignsList()),
      cal: q("Calendly bookings", fetchAll(() => sb.from("calendly_events").select("id,status,start_at,calendly_created_at,first_seen_at,canceled_at,event_type,calendly_event_hosts(calendly_user)"))),
      calTypes: q("Calendly booking pages", sb.from("calendly_event_types").select("id,name,is_consult,active")).then(must),
      calInv: q("Calendly bookers", fetchAll(() => sb.from("calendly_invitees").select("id,event,lead,status"))),
      calUsers: q("Calendly team", calUsers()),
      tasks: q("tasks", fetchAll(() => sb.from("task_board").select("id,lead,assigned_to,status,completed_date,completed_at,completed_by,closed_by_rule,due_date,due_at,overdue,done_on_time").order("id"))),
      notes: q("notes", fetchAll(() => sb.from("notes").select("id,lead,author,created_at"))),
      statusDays: q("time in each status", fetchAll(() => sb.from("lead_status_days").select("lead,status,entered_at,left_at,is_current,days"))),
      dealDays: q("time in each opportunity stage", fetchAll(() => sb.from("deal_stage_days").select("id,opportunity,lead,stage,start_date,end_date,is_current,days,program,owner"))),
      statuses: q("lead statuses", loadStatuses()),
      targets: q("targets", sb.from("targets").select("id,metric,period,starts_on,target,owner,set_by,set_at,note")).then(must),
      practice: q("practice consults", fetchAll(() => sb.from("consult_practice").select("event,call"))) });
    const D = { at: Date.now(), fails };
    Object.keys(d).forEach(k => D[k] = d[k] || []);
    // v6.39: practice (mock) calls are kept out of every report
    const pe = new Set(D.practice.map(p => p.event).filter(Boolean)), pc = new Set(D.practice.map(p => p.call).filter(Boolean));
    D.calls = D.calls.filter(c => !pc.has(c.id) && !pe.has(c.calendly_event)); D.cal = D.cal.filter(e => !pe.has(e.id)); D.calInv = D.calInv.filter(i => !pe.has(i.event));
    S.repData = D; return D;
  }

  // ----- Everything a report needs after the global filters: one context per draw -----
  function repCtx(D, F){
    const R = repRange(F);
    const inR = v => { const d = dayOf(v); return !!d && (!R.from || d >= R.from) && (!R.to || d <= R.to); };
    const owner = F.owner === "me" ? S.me.id : F.owner || "";
    const lead = Object.fromEntries(D.facts.map(f => [f.lead, f]));
    const listSrc = Object.fromEntries(D.lists.map(l => [l.id, l.source]));
    const campLeads = F.campaign ? new Set(D.emails.filter(e => e.campaign === F.campaign).map(e => e.lead)) : null;
    const anyLeadFilter = !!(F.program || F.list || F.source || F.campaign);
    // own: check the lead's owner; prog: check the lead's program (deals use their own program and owner).
    const leadOk = (id, own = true, prog = true) => {
      if (!id) return !anyLeadFilter && !(own && owner);
      const f = lead[id]; if (!f) return false;   // merged (or not visible)
      if (prog && F.program && f.program !== F.program) return false;
      if (own && owner && f.owner !== owner) return false;
      if (F.list && !(f.list_ids || []).includes(F.list)) return false;
      if (F.source && !(f.list_sources || []).includes(F.source)) return false;
      if (campLeads && !campLeads.has(id)) return false;
      return true; };
    const saleSum = {}; D.sales.forEach(s => saleSum[s.opportunity] = (saleSum[s.opportunity] || 0) + (Number(s.amount) || 0));
    const dealValue = o => saleSum[o.id] != null ? saleSum[o.id] : Number(o.potential_value) || 0;
    const C = { D, F, R, inR, owner, lead, listSrc, leadOk, dealValue,
      leads: D.facts.filter(f => leadOk(f.lead)),
      emails: D.emails.filter(e => lead[e.lead] && (!F.program || e.program === F.program) && (!owner || e.sent_by === owner)
        && (!F.list || e.list === F.list) && (!F.source || listSrc[e.list] === F.source) && (!F.campaign || e.campaign === F.campaign)),
      replies: D.replies.filter(r => leadOk(r.lead)),
      calls: D.calls.filter(c => leadOk(c.lead, false) && (!owner || c.host === owner)),
      opps: D.opps.filter(o => leadOk(o.lead, false, false) && (!F.program || o.program === F.program) && (!owner || o.owner === owner)) };
    // The weekly measures: each is a list of records with the date it counts on and the lead it belongs to.
    C.M = {
      leads: { label: "Leads added", rows: C.leads, at: f => f.created_at, lead: f => f.lead },
      researched: { label: "Researched", rows: C.leads.filter(f => f.first_to_vet_at), at: f => f.first_to_vet_at, lead: f => f.lead },
      qualified: { label: "Qualified", rows: C.leads.filter(f => f.qualified_at), at: f => f.qualified_at, lead: f => f.lead },
      emails: { label: "Emails sent", rows: C.emails, at: e => e.sent_at, lead: e => e.lead, emails: true },
      replies: { label: "Replies", rows: C.replies, at: r => r.received_at || r.created_at, lead: r => r.lead },
      booked: { label: "Consults booked", rows: C.calls, at: c => c.booked_at || c.created_at, lead: c => c.lead },
      held: { label: "Consults held", rows: C.calls.filter(c => c.status === "Held"), at: c => c.starts_at, lead: c => c.lead },
      won: { label: "Won", rows: C.opps.filter(o => o.status === "Won"), at: o => o.close_date, lead: o => o.lead, value: true } };
    C.inRange = k => C.M[k].rows.filter(r => C.inR(C.M[k].at(r)));
    // Calendly bookings: every booking made in the range (when it was booked; Calendly's own date), leads or not.
    // Only the date and the owner (the host) apply: bookers who aren't leads have no program, list or campaign.
    const hostTeam = Object.fromEntries(D.calUsers.map(u => [u.id, u.team]));
    C.cal = D.cal.filter(e => C.inR(e.calendly_created_at || e.first_seen_at) && (!owner || (e.calendly_event_hosts || []).some(h => hostTeam[h.calendly_user] === owner)));
    return C;
  }

  // ----- Drill-down: click a number to see the records behind it -----
  // Leads open on All leads (#crm?ids=a,b,c). A long list is passed through sessionStorage['bpf-drill'] as #crm?ids=drill.
  function drillA(n, ids, title){
    if (!n) return `<span class="muted">0</span>`;
    const k = "d" + Object.keys(S.drills || (S.drills = {})).length; S.drills[k] = [...new Set(ids.filter(Boolean))];
    return `<a href="#crm?ids=drill" data-drill="${k}" title="${esc(title || "See these leads")}">${typeof n === "number" ? n.toLocaleString() : n}</a>`;
  }
  const emailsHref = (C, from, to) => { const qs = new URLSearchParams({ f: "sent" }); const a = from || C.R.from, b = to || C.R.to;
    if (a) qs.set("from", a); if (b) qs.set("to", b); if (C.owner) qs.set("who", C.owner); return "#emails?" + qs; };
  const drillCount = (C, k, rows, from, to) => C.M[k].emails ? (rows.length ? `<a href="${emailsHref(C, from, to)}" title="See these emails">${rows.length}</a>` : `<span class="muted">0</span>`)
    : drillA(rows.length, rows.map(C.M[k].lead), "See these leads");
  if (!window.__bpfDrill) { window.__bpfDrill = true;
    document.addEventListener("click", e => { const a = e.target.closest?.("a[data-drill]"); if (!a) return; const ids = S.drills?.[a.dataset.drill]; if (!ids) return;
      if (ids.length <= 25) a.setAttribute("href", "#crm?ids=" + ids.join(","));
      else { a.setAttribute("href", "#crm?ids=drill"); try { sessionStorage.setItem("bpf-drill", JSON.stringify(ids)); } catch {} } }, true); }

  // ----- Charts: plain inline SVG and HTML bars, colors only from the page's tokens, so dark mode just works -----
  // Each SVG chart is drawn at its box's real width and redrawn when the window is resized.
  const chart = (() => {
    const live = new Set(); let rt;
    addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => live.forEach(f => f()), 150); });
    const keep = (el, draw) => { const f = () => { if (!el.isConnected) return live.delete(f); draw(); }; live.add(f); draw(); };
    const ticks = max => { if (max <= 0) return [0, 1]; const raw = max / 4, e = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / e;
      const step = Math.max(1, (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e), out = []; for (let v = 0; v <= max + step * .001; v += step) out.push(v); if (out[out.length - 1] < max) out.push(out[out.length - 1] + step); return out; };
    const fmtN = v => v >= 10000 ? Math.round(v / 1000) + "k" : v.toLocaleString();
    const legend = (el, series, redraw) => { const box = document.createElement("div"); box.className = "lgd";
      box.innerHTML = series.map((s, i) => `<button type="button" data-i="${i}" aria-pressed="${s.on !== false}" style="--c:${s.color}"><i style="${s.dash ? "border-top-style:dashed" : ""}"></i>${esc(s.name)}</button>`).join("");
      box.querySelectorAll("button").forEach(b => b.onclick = () => { const s = series[+b.dataset.i]; s.on = s.on === false; b.setAttribute("aria-pressed", s.on); redraw(); });
      el.before(box); };
    // line(el, { labels, series: [{ name, color, dash, values, on }], aria, height })
    function line(el, o){
      el.classList.add("chart"); el.setAttribute("role", "img"); el.setAttribute("aria-label", o.aria || "Line chart");
      const draw = () => { const W = Math.max(260, el.clientWidth), H = o.height || 240, L = 40, Rm = 12, T = 10, B = 28, pw = W - L - Rm, ph = H - T - B, n = o.labels.length;
        const on = o.series.filter(s => s.on !== false), max = Math.max(1, ...on.flatMap(s => s.values)), tk = ticks(max), top = tk[tk.length - 1];
        const x = i => L + (n <= 1 ? pw / 2 : i * pw / (n - 1)), y = v => T + ph - v / top * ph, every = Math.max(1, Math.ceil(n * 78 / pw));
        el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
          ${tk.map(v => `<line class="ax" x1="${L}" x2="${W - Rm}" y1="${y(v)}" y2="${y(v)}"/><text class="axt" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmtN(v)}</text>`).join("")}
          ${o.labels.map((l, i) => i % every ? "" : `<text class="axt" x="${x(i)}" y="${H - 8}" text-anchor="${n > 1 && i === 0 ? "start" : n > 1 && i === n - 1 ? "end" : "middle"}">${esc(l)}</text>`).join("")}
          ${on.map(s => `<polyline fill="none" style="stroke:${s.color}" stroke-width="2.2" ${s.dash ? 'stroke-dasharray="6 4"' : ""} points="${s.values.map((v, i) => x(i) + "," + y(v)).join(" ")}"/>
            ${s.values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${n > 40 ? 2 : 3.5}" style="fill:${s.color}"><title>${esc(s.name)}, ${esc(o.labels[i])}: ${v.toLocaleString()}</title></circle>`).join("")}`).join("")}
        </svg>`; };
      if (o.legend !== false) legend(el, o.series, draw);
      keep(el, draw);
    }
    // bars(el, { labels, series: [{ name, color, values }], stacked, aria, height, fmt, targets: [number|null per label] })
    function bars(el, o){
      el.classList.add("chart"); el.setAttribute("role", "img"); el.setAttribute("aria-label", o.aria || "Bar chart");
      const fmt = o.fmt || (v => v.toLocaleString());
      const draw = () => { const W = Math.max(260, el.clientWidth), H = o.height || 220, L = 44, Rm = 10, T = 10, B = 30, pw = W - L - Rm, ph = H - T - B, n = Math.max(1, o.labels.length);
        const on = o.series.filter(s => s.on !== false), tot = i => o.stacked ? on.reduce((a, s) => a + (s.values[i] || 0), 0) : Math.max(0, ...on.map(s => s.values[i] || 0));
        const max = Math.max(1, ...o.labels.map((_, i) => tot(i)), ...(o.targets || []).filter(v => v != null)), tk = ticks(max), top = tk[tk.length - 1];
        const y = v => T + ph - v / top * ph, slot = pw / n, gw = Math.min(64, slot * .72), every = Math.max(1, Math.ceil(n * 70 / pw));
        let marks = "";
        o.labels.forEach((l, i) => { const x0 = L + i * slot + (slot - gw) / 2;
          if (o.stacked) { let acc = 0; on.forEach(s => { const v = s.values[i] || 0; if (!v) return; marks += `<rect x="${x0}" y="${y(acc + v)}" width="${gw}" height="${Math.max(1, y(acc) - y(acc + v))}" style="fill:${s.color}"><title>${esc(l)} · ${esc(s.name)}: ${fmt(v)}</title></rect>`; acc += v; }); }
          else { const bw = gw / on.length; on.forEach((s, j) => { const v = s.values[i] || 0; marks += `<rect x="${x0 + j * bw}" y="${y(v)}" width="${Math.max(1, bw - 2)}" height="${Math.max(v ? 1 : 0, y(0) - y(v))}" style="fill:${s.color}"><title>${esc(l)} · ${esc(s.name)}: ${fmt(v)}</title></rect>`; }); }
          const t = o.targets?.[i]; if (t != null) marks += `<line x1="${x0 - 3}" x2="${x0 + gw + 3}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--ink)" stroke-width="2" stroke-dasharray="4 3"><title>${esc(l)} · target: ${fmt(t)}</title></line>`;
          if (!(i % every)) marks += `<text class="axt" x="${L + i * slot + slot / 2}" y="${H - 9}" text-anchor="middle">${esc(l.length > 16 ? l.slice(0, 15) + "…" : l)}</text>`; });
        el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${tk.map(v => `<line class="ax" x1="${L}" x2="${W - Rm}" y1="${y(v)}" y2="${y(v)}"/><text class="axt" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${o.fmt ? o.fmt(v) : fmtN(v)}</text>`).join("")}${marks}</svg>`; };
      if (o.series.length > 1 && o.legend !== false) legend(el, o.series, draw);
      keep(el, draw);
    }
    // hbars(el, { rows: [{ label, value, text, sub, color, href }], aria, max }): horizontal bars (HTML), links allowed in text.
    function hbars(el, o){
      el.classList.add("chart"); el.setAttribute("role", "figure"); el.setAttribute("aria-label", o.aria || "Bar chart");
      const max = o.max || Math.max(1, ...o.rows.map(r => r.value || 0));
      el.innerHTML = o.rows.length ? `<div class="hb">${o.rows.map(r => `<span class="lb" title="${esc(r.label)}">${esc(r.label)}</span>
        <span class="tr" title="${esc(r.label)}: ${esc(r.title || String(r.value))}"><i style="width:${Math.min(100, (r.value || 0) / max * 100).toFixed(1)}%;${r.color ? "--c:" + r.color : ""}"></i></span>
        <span class="v">${r.text ?? (r.value || 0).toLocaleString()}${r.sub ? ` <small class="muted">${r.sub}</small>` : ""}</span>`).join("")}</div>` : `<p class="muted">Nothing to show for this filter.</p>`;
    }
    return { line, bars, hbars };
  })();

  // ----- Buckets for the weekly numbers: Monday weeks (or months), Eastern -----
  function repBuckets(C, by){
    const key = by === "month" ? dMonth : dMon;
    let a = C.R.from, b = C.R.to && C.R.to < etToday() ? C.R.to : etToday();   // no empty future weeks
    if (!a) { const all = Object.keys(C.M).flatMap(k => C.M[k].rows.map(r => dayOf(C.M[k].at(r)))).filter(Boolean).sort(); a = all[0] || b; }
    const out = []; for (let d = key(a); d <= b && out.length < 260; d = by === "month" ? dMonth(dAdd(d, 32)) : dAdd(d, 7)) out.push(d);
    return { key, list: out, label: d => by === "month" ? new Intl.DateTimeFormat("en-US", { month: "short", year: "numeric", timeZone: "UTC" }).format(new Date(d + "T12:00:00Z")) : fmtDate(d),
      end: d => by === "month" ? dMonthEnd(d) : dAdd(d, 6) };
  }
  function repWeekly(C, by){
    const B = repBuckets(C, by), rows = B.list.map(d => ({ week_of: d, _label: B.label(d), _end: B.end(d), _r: {} }));
    const at = Object.fromEntries(rows.map(r => [r.week_of, r]));
    Object.keys(C.M).forEach(k => { rows.forEach(r => r._r[k] = []);
      C.inRange(k).forEach(x => { const r = at[B.key(dayOf(C.M[k].at(x)))]; if (r) r._r[k].push(x); }); });
    rows.forEach(r => { Object.keys(C.M).forEach(k => r[k] = r._r[k].length); r.won_value = r._r.won.reduce((a, o) => a + C.dealValue(o), 0); });
    return rows;
  }
  const WEEKLY_SERIES = [["leads", "var(--accent)", false], ["researched", "var(--muted)", true], ["qualified", "var(--ok)", false], ["emails", "var(--warn)", false],
    ["replies", "var(--ink)", true], ["booked", "var(--accent)", true], ["held", "var(--ok)", true], ["won", "var(--bad)", false]];

  // ----- The reports. Each: key, title, question, instr (HTML), run(C, el), card(C, el) for the dashboard -----
  const FUNNEL_STEPS = [["added", "Added", "created_at"], ["researched", "Researched", "first_to_vet_at"], ["qualified", "Qualified", "qualified_at"],
    ["emailed", "Emailed", "first_sent_at"], ["replied", "Replied", "first_reply_at"], ["booked", "Consult booked", "first_booked_at"],
    ["held", "Consult held", "first_held_at"], ["won", "Won", "won_at"]];
  const funnelCounts = (C, set) => FUNNEL_STEPS.map(([k, label, col]) => ({ k, label, ids: set.filter(f => C.inR(f[col])).map(f => f.lead) }));
  function funnelBars(C, el, steps){
    const first = steps[0].ids.length;
    chart.hbars(el, { aria: "Funnel: " + steps.map(s => `${s.label} ${s.ids.length}`).join(", "), max: Math.max(1, ...steps.map(s => s.ids.length)),
      rows: steps.map((s, i) => ({ label: s.label, value: s.ids.length, color: s.k === "won" ? "var(--ok)" : "var(--accent)",
        text: drillA(s.ids.length, s.ids, `See the ${s.label.toLowerCase()} leads`),
        sub: i ? `${pctOf(s.ids.length, steps[i - 1].ids.length)} of the step before · ${pctOf(s.ids.length, first)} of added` : "",
        title: `${s.ids.length}${i ? `, ${pctOf(s.ids.length, steps[i - 1].ids.length)} of the step before` : ""}` })) });
  }
  const repGroupSel = (key, cur, choices) => `<label class="muted" style="font-size:14px">Group by <select data-group="${key}">${opts(choices.map(([value, label]) => ({ value, label })), cur)}</select></label>`;
  const REP_GROUPS = { program: ["Program", (C, f) => [f.program || "(none)"]], list: ["List", (C, f) => (f.list_ids || []).length ? f.list_ids.map(id => C.D.lists.find(l => l.id === id)?.name || "(unknown list)") : ["(no list)"]],
    owner: ["Owner", (C, f) => [S.team[f.owner] || "(nobody)"]], source: ["Source", (C, f) => (f.list_sources || []).length ? f.list_sources : [f.lead_source || "(none)"]] };

  const REPORTS = [
    { key: "weekly", title: "Weekly numbers", question: "How did each week go?",
      instr: `One row per week (Monday to Sunday, Eastern), or per month. Each number counts what happened in that week:
        <ul style="margin:6px 0 0 18px;padding:0"><li><b>Leads added</b>: when the lead was created in the CRM.</li>
        <li><b>Researched</b>: the first time the lead's status became To qualify. <b>Qualified</b>: the first time it became Qualified. Status history starts Tue 17 Nov 2026, so leads that already had a status that day count on that day.</li>
        <li><b>Emails sent</b>: emails marked Sent, by when they were sent (the same emails as Email results).</li>
        <li><b>Replies</b>: when the reply came in. <b>Consults booked</b>: when the consult was booked (or logged). <b>Consults held</b>: consults marked Held, by their date. These count consults on leads (the <code>calls</code> list); raw Calendly bookings are counted separately in Calendly bookings, so nothing is counted twice.</li>
        <li><b>Won</b>: opportunities won, by close date; <b>won value</b> is the sale amount, or else the opportunity's value.</li></ul>
        Click a number to see the leads (or emails) behind it. Click a name in the legend to hide or show that line. The table sorts, groups and downloads (Excel or CSV) like every sheet in the CRM.`,
      card(C, el){ const rows = repWeekly(C, "week").slice(-12);
        chart.line(el, { labels: rows.map(r => r._label), height: 200, aria: "Leads added and emails sent per week",
          series: WEEKLY_SERIES.map(([k, c, dash]) => ({ name: C.M[k].label, color: c, dash, values: rows.map(r => r[k]), on: ["leads", "qualified", "emails", "booked"].includes(k) })) }); },
      run(C, el){
        const by = C.F.groups.weekly === "month" ? "month" : "week", rows = repWeekly(C, by);
        const tk = TARGET_METRICS.find(([, k]) => k === C.F.groups.weekly_t) || TARGET_METRICS[0], hasT = C.D.targets.some(t => t.period === by);
        el.innerHTML = `<section class="panel"><header><h3>${by === "month" ? "Each month" : "Each week"}</h3><span class="inline" style="gap:10px">${repGroupSel("weekly", by, [["week", "Week"], ["month", "Month"]])}
            <button class="btn sm" type="button" data-wcsv title="week_of, leads, consults_booked, consults_held, clients_won, notes: the columns of workspace/Leads/weekly.csv">Download weekly.csv</button></span></header><div id="wkChart"></div></section>
          ${hasT ? `<section class="panel"><header><h3>${esc(C.M[tk[1]].label)} against target</h3>${repGroupSel("weekly_t", tk[1], TARGET_METRICS.map(([, k]) => [k, C.M[k].label])).replace("Group by", "Measure")}</header><div id="wkTarget"></div>
            <p class="muted" style="margin:8px 0 0;font-size:13.5px">The dashed tick on each bar is that ${by}'s target (${esc(C.owner ? S.team[C.owner] || "this person" : "whole team")}).</p></section>` : ""}
          <section id="wkSheet"></section>`;
        el.querySelector("[data-wcsv]").onclick = () => { const lines = weeklyCsv(C); toast(`Downloaded weekly.csv (${lines.length - 1} weeks).`); };
        if (hasT) chart.bars(document.getElementById("wkTarget"), { labels: rows.map(r => r._label), aria: `${C.M[tk[1]].label} per ${by} against target`,
          series: [{ name: C.M[tk[1]].label, color: "var(--accent)", values: rows.map(r => r[tk[1]]) }], targets: rows.map(r => targetFor(C.D, tk[0], by, r.week_of, C.owner)) });
        chart.line(document.getElementById("wkChart"), { labels: rows.map(r => r._label), aria: `${C.M.leads.label} and other measures per ${by}`,
          series: WEEKLY_SERIES.map(([k, c, dash]) => ({ name: C.M[k].label, color: c, dash, values: rows.map(r => r[k]), on: true })) });
        const num = k => ({ key: k, label: C.M[k].label, type: "number", html: r => drillCount(C, k, r._r[k], r.week_of < (C.R.from || "") ? C.R.from : r.week_of, C.R.to && r._end > C.R.to ? C.R.to : r._end) });
        Sheet.create(document.getElementById("wkSheet"), { id: "rep_weekly", label: "Weekly numbers", rows: rows.slice().reverse(), rowKey: r => r.week_of, remember: true, views: viewStore("rep_weekly"), toast, fileName: "Weekly numbers",
          columns: [{ key: "week_of", label: by === "month" ? "Month of" : "Week of", type: "date", width: 150 }, ...Object.keys(C.M).map(num), { key: "won_value", label: "Won value", type: "money" }],
          defaults: { frozen: 1, sort: [{ key: "week_of", dir: "desc" }] }, empty: "Nothing in this range." }); } },
    { key: "funnel", title: "Funnel", question: "Where do leads drop off?",
      instr: `Each bar counts the leads that reached that step <b>for the first time within the date range</b> (period mode, as Close does it). It is not a cohort: a lead added last month and qualified this week counts as Qualified this week but not as Added, so a step can be bigger than the one before it.
        <ul style="margin:6px 0 0 18px;padding:0"><li><b>Researched</b> = first became To qualify; <b>Qualified</b> = first became Qualified (status history starts Tue 17 Nov 2026).</li>
        <li><b>Emailed</b> = the lead's first sent email; <b>Replied</b> = their first reply; <b>Consult booked / held</b> = their first consult (from the consults list, not raw Calendly bookings); <b>Won</b> = an opportunity won, by close date.</li>
        <li>Each bar shows the % of the step before and the % of Added, rounded the same way as Email results.</li></ul>
        The global Owner filter means the lead's owner here. Click a number to see those leads.`,
      card(C, el){ funnelBars(C, el, funnelCounts(C, C.leads)); },
      run(C, el){
        const g = REP_GROUPS[C.F.groups.funnel] ? C.F.groups.funnel : "program", [gLabel, gOf] = REP_GROUPS[g];
        el.innerHTML = `<section class="panel"><header><h3>Funnel</h3></header><div id="fnChart"></div><p class="muted" style="margin:10px 0 0;font-size:13.5px">Period mode: each step counts leads that first reached it in this date range, so a step can be bigger than the one before.</p></section>
          <section class="panel"><header><h3>By ${esc(gLabel.toLowerCase())}</h3>${repGroupSel("funnel", g, Object.entries(REP_GROUPS).map(([k, v]) => [k, v[0]]))}</header><div id="fnSheet"></div></section>`;
        funnelBars(C, document.getElementById("fnChart"), funnelCounts(C, C.leads));
        const groups = {}; C.leads.forEach(f => gOf(C, f).forEach(name => (groups[name] = groups[name] || []).push(f)));
        const rows = Object.entries(groups).map(([name, set]) => { const st = funnelCounts(C, set), r = { name, _st: st }; st.forEach(s => r[s.k] = s.ids.length); return r; }).filter(r => FUNNEL_STEPS.some(([k]) => r[k]));
        Sheet.create(document.getElementById("fnSheet"), { id: "rep_funnel", label: "Funnel by " + gLabel.toLowerCase(), rows, rowKey: r => r.name, remember: true, views: viewStore("rep_funnel"), toast, fileName: "Funnel",
          columns: [{ key: "name", label: gLabel, width: 200 }, ...FUNNEL_STEPS.map(([k, label], i) => ({ key: k, label, type: "number",
            html: r => drillA(r[k], r._st[i].ids) + (i && r[FUNNEL_STEPS[i - 1][0]] ? ` <small class="muted">${pctOf(r[k], r[FUNNEL_STEPS[i - 1][0]])}</small>` : "") }))],
          defaults: { frozen: 1, sort: [{ key: "added", dir: "desc" }] }, empty: "No leads reached any step in this range." }); } },
    { key: "pipeline", title: "Pipeline", question: "What's open, and how much?",
      instr: `A snapshot of every open opportunity right now (status In progress), one bar per open stage in the board's order. <b>The date range doesn't apply</b>, because it's a snapshot; program, owner (the opportunity's owner), list or source and campaign do.
        <ul style="margin:6px 0 0 18px;padding:0"><li><b>Value</b> = the total of the opportunities' values. Opportunities with no value entered are counted in "No value yet", so the total can be low until values are filled in.</li>
        <li>The bars are split by program or owner (Group by). Click a count to see those leads, or open the board with the same program and owner.</li></ul>`,
      card(C, el){ const st = pipeStages(C); chart.hbars(el, { aria: "Open opportunities by stage: " + st.map(s => `${s.label} ${s.rows.length}`).join(", "),
        rows: st.map(s => ({ label: s.label, value: s.rows.length, text: drillA(s.rows.length, s.rows.map(o => o.lead), "See these opportunities' leads"), sub: s.value ? money0(s.value) : s.rows.length ? `${s.noValue} with no value` : "" })) }); },
      run(C, el){
        const g = ["program", "owner"].includes(C.F.groups.pipeline) ? C.F.groups.pipeline : "program", st = pipeStages(C);
        const gOf = o => g === "owner" ? S.team[o.owner] || "(nobody)" : o.program || "(none)", keys = [...new Set(C.opps.filter(o => o.status === "In progress").map(gOf))].sort();
        const COLORS = ["var(--accent)", "var(--ok)", "var(--warn)", "var(--bad)", "var(--muted)", "var(--ink)"];

        const all = st.flatMap(s => s.rows), tot = all.reduce((a, o) => a + C.dealValue(o), 0);
        el.innerHTML = `<div class="cards kpis"><div class="card kpi"><span>Open opportunities</span><b>${drillA(all.length, all.map(o => o.lead))}</b><small class="muted">right now</small></div>
            <div class="card kpi"><span>Open value</span><b>${money0(tot)}</b><small class="muted">${all.filter(o => !Number(o.potential_value)).length} with no value yet</small></div></div>
          <section class="panel"><header><h3>Open opportunities by stage</h3><span class="inline" style="gap:10px">${repGroupSel("pipeline", g, [["program", "Program"], ["owner", "Owner"]])}<a class="btn sm" href="${board}">Open the board</a></span></header><div id="ppChart"></div>
            <p class="muted" style="margin:8px 0 0;font-size:13.5px">A snapshot: the date range doesn't apply.</p></section><section id="ppSheet"></section>`;
        chart.bars(document.getElementById("ppChart"), { labels: st.map(s => s.label), stacked: true, aria: "Open opportunities by stage: " + st.map(s => `${s.label} ${s.rows.length}`).join(", "),
          series: keys.map((k, i) => ({ name: k, color: COLORS[i % COLORS.length], values: st.map(s => s.rows.filter(o => gOf(o) === k).length) })) });
        Sheet.create(document.getElementById("ppSheet"), { id: "rep_pipeline", label: "Open opportunities by stage", rows: st.map((s, i) => ({ ...s, i, n: s.rows.length })), rowKey: r => r.label, remember: true, views: viewStore("rep_pipeline"), toast, fileName: "Pipeline",
          columns: [{ key: "label", label: "Stage", width: 220 }, { key: "n", label: "Opportunities", type: "number", html: r => drillA(r.n, r.rows.map(o => o.lead)) }, { key: "value", label: "Value", type: "money" },
            { key: "noValue", label: "No value yet", type: "number" }, ...keys.map(k => ({ key: "g_" + k, label: k, type: "number", get: r => r.rows.filter(o => gOf(o) === k).length }))],

    { key: "wonlost", title: "Won / lost", question: "What closed, and why did we lose?",

  // ----- Targets (v6.37, table `targets`, migration 0076) and compare to the previous period -----

  // Move a deal to another stage. Lost asks why. Only saves if nobody changed the deal meanwhile.

    const inp = 'style="width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"';
    const v = await askForm(title || `Won: ${o.author || "this opportunity"}`, `<p class="muted" style="margin:0;font-size:14px">A won opportunity needs the program they bought and the amount.</p>
      <div class="field"><label>Program</label><select name="program" required ${inp}>${opts(TIERS, prog, "Pick one")}</select></div>
      <div class="field"><label>Amount ($)</label><input type="number" name="value" min="1" step="1" required value="${esc(val)}" ${inp}></div>`, "Mark won");

  // v6.72: save a person's change to an opportunity only if nobody changed it meanwhile. Rules (a reply, a booking, the Calendly
  // sync) no longer bump the version (migration 0102); when it moved anyway but none of the fields this person changed did,
  // refetch and save once more on the fresh version. A real clash (someone changed the same field) is still refused: { clash }.
  async function saveOpp(o, patch, cols){
    cols = cols || "id,version";
    const r = await sb.from("opportunities").update(patch).eq("id", o.id).eq("version", o.version).select(cols);
    if (r.error || r.data?.length) return r;
    const { data: fresh } = await sb.from("opportunities").select("*").eq("id", o.id).maybeSingle();
    if (!fresh) return r;
    const nv = x => x == null ? "" : String(x), same = (a, b) => nv(a) === nv(b) || (nv(a) !== "" && nv(b) !== "" && Number(a) === Number(b));
    if (Object.keys(patch).some(k => !(k in o) || !same(fresh[k], o[k]))) return { ...r, clash: true, fresh };
